H += part(39, 'Swipe actions', 'e', 'Swipe a row left to show Flag and an 88 pt Delete. Tap elsewhere to close. <code>.pk-swipe</code>',
  `<div class="pk-list" data-name="Swipe list">${['Morning notes', 'Weekly plan', 'Recipes'].map(t => `<div class="pk-swipe" data-name="Swipe row: ${t}"><div class="pk-swipe-actions"><button class="pk-orange" data-a="flag">${ic('flag', 20)}Flag</button><button class="pk-red" data-a="delete">${ic('trash', 20)}Delete</button></div><div class="pk-swipe-front pk-row">${t}</div></div>`).join('')}</div>`);
H += part(40, 'Reorderable list', 'e', 'Hold the handle and drag to reorder. <code>.pk-reorder</code> with a <code>.pk-grip</code> per row',
  `<div class="pk-list pk-reorder" id="reo" data-name="Reorder list">${['Warm up', 'Main set', 'Cool down', 'Stretch'].map(t => `<div class="pk-row" data-name="Row: ${t}"><span class="pk-row-text">${t}</span><span class="pk-grip" data-name="Handle">${ic('grip', 20)}</span></div>`).join('')}</div>`);


const openBtn = (id, label) => `<button class="pk-btn pk-cta pk-glass pk-tinted pk-press" id="${id}" data-name="Button: ${label}">${label}</button>`;
H += sec('overlays', 'Overlays');
H += part(41, 'Sheet', 'mx', 'Rises from the bottom, 8 pt from the edges, corners following the screen\'s (46, D17). Drag it down from the top or, when its content is at the top, from the content; a flick faster than 700 pt/s closes it. Dim 54%. Strong glass (<code>sheet.glass</code>, D15); <code>sheet.dragShrink</code> (D14) makes it shrink while dragged. <code>Parts.sheet({…})</code>',
  `<div class="gal-row">${openBtn('o-sheet', 'Open sheet')}</div>`);
H += part(42, 'Sheet with stops, and growing to full', 'mx', 'Stops at 45% and full (90 pt from the top); a flick faster than 700 pt/s jumps a stop, otherwise it snaps 40% of the way. It turns solid at full. A sheet named in <code>sheet.growsToFull</code> (D10) grows to full screen when its content needs room. Names in <code>sheet.withStops</code> (D09).',
  `<div class="gal-row">${openBtn('o-stops', 'Sheet with stops')}${openBtn('o-grows', 'Sheet that grows')}</div>`);
H += part(43, 'Full-screen cover', 'e', 'Covers the whole screen, rising over 500 ms. ✕ closes it. A sheet named in <code>sheet.fullScreen</code> (D10) opens as a cover. <code>Parts.cover({…})</code>',
  `<div class="gal-row">${openBtn('o-cover', 'Open cover')}</div>`);
H += part(44, 'Popover', 'e', 'Grows out of its button on the menu springs; its blur fades in over 260 ms. Tap outside to close. <code>Parts.popover(button, html)</code>',
  stage(`<button class="pk-btn pk-pill pk-glass pk-press" id="o-pop" data-name="Button: Show popover">${ic('bell', 18)} Show popover</button>`));
H += part(46, 'Long-press menu', 'm', 'Hold a row. At 200 ms it lifts, growing to ×1.04; at 700 ms the menu opens (<code>timing.hold</code>). Dim 20% in light, 25% in dark, no blur. Closes in 170 ms. Moving more than 10 pt cancels; right-click opens it at once. Same menu style as pull-downs (16). <code>.pk-hold</code> and <code>pk:hold</code>',
  `<div class="pk-list" id="ctxList" data-name="Long-press list">${['Morning notes', 'Weekly plan', 'Recipes'].map(t => `<div class="pk-row pk-hold" data-name="Row: ${t}"><span class="pk-row-text">${t}<small>Hold me</small></span></div>`).join('')}</div>`);
H += part(47, 'Action sheet', 'e', 'A list of actions from the bottom, with Cancel on its own (<code>choices</code> actionSheet, D07; or a sheet). <code>Parts.choices({…})</code>',
  `<div class="gal-row">${openBtn('o-as', 'Show actions')}</div>
  <p class="gal-pv" style="margin-top:12px"><b>One element can differ (new in 1.1).</b> The action sheet below carries its own timing in its style, <code>style: '--dur-rise: 900ms'</code>, so only it rises and leaves slower than the kit's 350 ms. Turn the switch off and it's back to the kit's. <code>Parts.differences()</code> lists it while it's on.</p>
  <div class="gal-row">${openBtn('o-as-slow', 'Show slow actions')}</div>
  <div class="pk-list" style="margin-top:10px">${swRow('Own timing (900 ms)', true).replace('data-name="Switch: Own timing (900 ms)"', 'id="slowSw" data-name="Switch: Own timing"')}</div>`);
H += part(48, 'Alert', 'e', 'A centred box with two capsule buttons. Appears over 250 ms, scaling from 1.1 (<code>confirm</code> alert, D08; or a sheet). Never the browser\'s own confirm. <code>Parts.confirm({…})</code>',
  `<div class="gal-row">${openBtn('o-dlg', 'Delete…')}</div>
  <p class="gal-pv" style="margin-top:12px"><b>More than one action (new in 1.3).</b> Pass <code>actions: [{ label, red, value }]</code> and the alert shows each one, with Cancel last. Three or more buttons stack, as iOS alerts do. It gives back the chosen action's value, or nothing if Cancel is tapped.</p>
  <div class="gal-row">${openBtn('o-dlg3', 'Reset all…')}</div>`);
H += part(49, 'Toast', 'e', 'Drops in from the top over 500 ms, stays 3 s (<code>timing.toast</code>), then leaves upward over 350 ms. Undo where something can be undone. <code>Parts.toast(text, {undo})</code>',
  `<div class="gal-row">${openBtn('o-toast', 'Show toast')}</div>`);


H += sec('effects', 'Effects');
H += part(45, 'Menu with submenu', 'pin', 'Tap "Sort by". The submenu opens over its parent; the parent shrinks to 0.971 and its rows fade to half (measured). Pinned (D11): only menus named in <code>menu.submenus</code> open submenus; elsewhere the same items show inline under a small label (switch Pinned parts off to see).',
  stage(`<button class="pk-btn pk-pill pk-glass pk-press" id="o-sub" data-name="Button: Options">Options ${ic('chevD', 18)}</button>`));
H += part(50, 'Glass appearing and leaving', 'pin', 'Appearing: 250 ms, scaling 1.15 → 1, glass full at 92%, icon sharpening from an 8 px blur over the last 65%. Leaving: 350 ms, icon gone by 55%, then the empty glass fades. Pinned (D12): only parts named in <code>glass.appear</code>; elsewhere they appear at once. <code>Parts.appear(el, {key})</code> <code>Parts.leave(el, {key})</code>',
  stage(`<div class="gal-mzslot" id="mzslot" data-name="Slot"><button class="pk-btn pk-circle gal-mz pk-glass pk-press" data-name="Appearing glass" aria-label="Star">${ic('star', 26)}</button></div><button class="pk-btn pk-pill pk-glass pk-press" id="mzBtn" data-name="Button: Hide">Hide</button>`, 'tall'));
H += part(52, 'Finger glint and drag', 'pin', 'Press and drag. A soft glow follows the finger (10% light, 7% dark, 1.6 × the short side; by eye). Dragged, the button leans toward the finger by a few points with no bounce back (measured). Pinned (D13): only buttons whose <code>data-glint</code> is named in <code>press.glint</code>.',
  stage(`<button class="pk-btn gal-pad pk-glass pk-press" id="pad" data-glint="pad" data-name="Glint pad">Press and drag</button>`, 'tall'));

/* ==SECTIONS== */

H += `<div class="gal-empty" id="empty">No parts match.</div><p class="gal-foot" data-name="Footer">${NUMS.length} parts · parts kit ${Parts.version} · numbers from sdegenaar/liquid_glass_widgets (MIT) · not in the kit yet: 7 inline tab bar, 8 toolbar, 9 side bar, 20 page dots (later); 28 password field, 30 form field, 31 picker wheel, 32 date picker, 37 disclosure group (not planned)</p>`;
$('#wrap').innerHTML = H;


/* ---------- this screen: dock, top bar, section tabs, search ---------- */
const pg = $('#pg');
$('#dock').innerHTML = `${tabsHTML(TABS)}<button class="pk-btn pk-tab-pill pk-glass pk-press" id="mainPill" data-name="Folded pill" aria-label="Open the tab bar">${ic('layers')}</button>${searchHTML('Find a part', 'findIn')}`;
$('#moreBtn').innerHTML = ic('more');
$('#pushBack').innerHTML = ic('chevL');
const mainTb = $('#dock .pk-tabbar');
const TABSEC = [['glass', 'bars', 'buttons'], ['controls', 'inputs'], ['lists'], ['overlays', 'effects']];
const TABICON = ['layers', 'sliders', 'list', 'copy'];
let lockTab = 0;
mainTb.addEventListener('pk:change', e => { lockTab = Date.now() + 900; const first = $('#s-' + TABSEC[e.detail.index][0]); if (first) pg.scrollTo({ top: Math.max(0, first.offsetTop - 96), behavior: Parts.motion.on() ? 'smooth' : 'auto' }); $('#mainPill').innerHTML = ic(TABICON[e.detail.index]); });
pg.addEventListener('scroll', () => {
  if (Date.now() < lockTab) return; let t = 0; TABSEC.forEach((ids, i) => { const el = $('#s-' + ids[0]); if (el && el.offsetTop - 140 <= pg.scrollTop) t = i; });
  const cur = [...mainTb.querySelectorAll('.pk-tab')].findIndex(x => x.classList.contains('on')); if (t !== cur) { Parts.select(mainTb, t); $('#mainPill').innerHTML = ic(TABICON[t]); }
}, { passive: true });
function filter(q) { q = q.trim().toLowerCase(); let any = 0;
  $$('.gal-part').forEach(p => { const hit = !q || p.dataset.q.includes(q); p.style.display = hit ? '' : 'none'; if (hit) any++; });
  $$('.gal-sh').forEach(h => { let n = h.nextElementSibling, vis = false; while (n && !n.classList.contains('gal-sh')) { if (n.classList.contains('gal-part') && n.style.display !== 'none') vis = true; n = n.nextElementSibling; } h.style.display = vis ? '' : 'none'; });
  $('#empty').style.display = any ? 'none' : 'block'; if (q) pg.scrollTop = 0; }
$('#findIn').addEventListener('input', e => filter(e.target.value));

/* ---------- demos: bars ---------- */
$('#edgeSeg').addEventListener('pk:change', e => { const b = e.detail.index === 1; $('#edgeMini .pk-edge').style.display = b ? 'none' : ''; $('#edgeMini .pk-edge-blur').style.display = b ? '' : 'none'; });
$('#foldBtn').addEventListener('click', () => { const d = $('#foldDemo'), m = !d.classList.contains('pk-folded'); d.classList.toggle('pk-folded', m); $('#foldBtn').textContent = m ? 'Open' : 'Fold'; });
$('#foldDemo').addEventListener('click', e => { if (e.target.closest('.pk-tab-pill')) $('#foldBtn').textContent = 'Fold'; });
$('#pushOpen').addEventListener('click', () => Parts.push($('#push')));
$('#pushBack').addEventListener('click', () => Parts.pop($('#push')));
(() => { let st = 0; const L = $('#mbL'), R = $('#mbR'), T = $('#mbT');
  $('#mbGo').addEventListener('click', () => { st = 1 - st; T.textContent = st ? 'Details' : 'Home';
    if (st) Parts.bar.appear(L, `<button class="pk-btn pk-circle pk-glass pk-press" data-name="Back button" aria-label="Back">${ic('chevL')}</button>`); else Parts.bar.leave(L);
    Parts.bar.swap(R, ic(st ? 'more' : 'plus')); $('#mbGo').textContent = st ? 'Go back' : 'Next page'; }); })();
$('#pullBtn').addEventListener('click', () => { if (Parts.menu) Parts.menu($('#pullBtn'), [{ label: 'Name', icon: ic('check', 18) }, { label: 'Date added' }, { label: 'Last opened' }, '-', { label: 'Ascending', icon: ic('chevD', 18) }], { onPick: it => Parts.toast && Parts.toast(it.label) }); });
$('#moreBtn').addEventListener('click', () => { if (Parts.menu) Parts.menu($('#moreBtn'), [{ label: 'Expand all', icon: ic('list', 18) }, { label: 'Collapse all', icon: ic('minus', 18) }, '-', { label: 'About these parts', icon: ic('star', 18) }], { onPick: it => Parts.toast && Parts.toast(it.label) }); });


/* ---------- demos: controls ---------- */
$('#vol').addEventListener('pk:input', e => $('#slv').textContent = Math.round(e.detail.value));
(() => { let p = 35; $('#runBtn').addEventListener('click', () => { p = p >= 100 ? 10 : Math.min(100, p + 25); $('#pb').style.setProperty('--pk-v', p); $('#ring').style.setProperty('--pk-v', p); }); })();


/* ---------- demos: lists ---------- */
$$('.pk-swipe-actions button').forEach(b => b.addEventListener('click', () => { const t = b.closest('.pk-swipe').querySelector('.pk-swipe-front').textContent; if (Parts.toast) Parts.toast(b.dataset.a === 'delete' ? `Deleted “${t}”` : 'Flagged', b.dataset.a === 'delete' ? { undo: () => Parts.toast('Undone') } : null); }));


/* ---------- demos: overlays ---------- */
const filler = n => `<div class="pk-list" style="margin-top:14px">${Array.from({ length: n }, (_, i) => `<div class="pk-row"><span class="pk-row-text">Row ${i + 1}</span></div>`).join('')}</div>`;
$('#o-sheet').addEventListener('click', () => Parts.sheet({ title: 'Sheet', name: 'Sheet', html: `<p class="gal-sub" style="text-align:center">Drag me down from here or the top, or flick, to close.</p>${filler(3)}` }));
$('#o-stops').addEventListener('click', () => Parts.sheet({ key: 'stops', title: 'Sheet with stops', name: 'Sheet with stops', html: `<p class="gal-sub" id="stopTxt">At 45%. Drag up for full, down to close. At full, scroll the rows, then pull down from the top of them.</p>${filler(16)}` }));
$('#o-grows').addEventListener('click', () => { const sh = Parts.sheet({ key: 'grows', title: 'New item', name: 'Sheet that grows',
  html: `<p class="gal-sub">Opens at 45%. Choosing Fill in raises it to full screen, where it reads as a cover.</p><div class="pk-list" style="margin-top:12px"><button class="pk-row pk-tap" id="growBtn"><span class="pk-row-text" style="color:var(--accent)">Fill in by hand</span>${chev}</button></div>${filler(10)}` });
  sh.body.querySelector('#growBtn').addEventListener('click', () => sh.grow()); });
$('#o-cover').addEventListener('click', () => Parts.sheet({ key: 'cover', title: 'Cover', name: 'Full-screen cover', html: `<p class="gal-sub">Covers the whole screen, tab bar included. ✕ closes it.</p>` }));
$('#o-pop').addEventListener('click', () => Parts.popover($('#o-pop'), `<b style="display:block;font-size:17px;margin-bottom:4px">Popover</b>Grows out of its button. Blur 10 at 12% white, fading in over 260 ms. Tap outside to close.`));
$('#ctxList').addEventListener('pk:hold', e => e.detail.open([{ label: 'Copy', icon: ic('copy', 18) }, { label: 'Share', icon: ic('share', 18) }, { label: 'Favourite', icon: ic('heart', 18) }, '-', { label: 'Delete', icon: ic('trash', 18), red: true }], { name: 'Long-press menu', onPick: it => Parts.toast(it.label) }));
$('#o-as').addEventListener('click', () => Parts.choices({ title: 'What would you like to do with “Weekly plan”?', actions: [{ label: 'Duplicate' }, { label: 'Move to folder' }, { label: 'Delete', red: true }] }).then(v => { if (v) Parts.toast(v === 'Delete' ? 'Deleted “Weekly plan”' : v, v === 'Delete' ? { undo: () => Parts.toast('Undone') } : null); }));
$('#o-as-slow').addEventListener('click', () => Parts.choices({ title: 'This action sheet has its own timing', name: 'Slow action sheet', style: $('#slowSw').classList.contains('on') ? '--dur-rise: 900ms' : '',
  actions: [{ label: 'Duplicate' }, { label: 'Move to folder' }] }));
$('#o-dlg').addEventListener('click', () => Parts.confirm({ title: 'Delete “Weekly plan”?', message: "This can't be undone.", action: 'Delete' }).then(yes => { if (yes) Parts.toast('Deleted “Weekly plan”'); }));
$('#o-dlg3').addEventListener('click', () => Parts.confirm({
  title: 'Reset all data?', message: 'Everything saved on this device will be deleted. Back up first to keep a copy.',
  actions: [{ label: 'Back up first', value: 'backup' }, { label: 'Delete everything', red: true, value: 'delete' }],
}).then(v => Parts.toast(v === 'backup' ? 'Backing up first' : v === 'delete' ? 'Deleted everything' : 'Kept everything')));
$('#o-toast').addEventListener('click', () => Parts.toast('Saved to Library', { undo: () => Parts.toast('Undone') }));


/* ---------- demos: effects ---------- */
$('#o-sub').addEventListener('click', () => Parts.menu($('#o-sub'), [{ label: 'Sort by', sub: [{ label: 'Name', icon: ic('check', 18) }, { label: 'Date added' }, { label: 'Size' }] }, { label: 'View as', sub: [{ label: 'List', icon: ic('check', 18) }, { label: 'Grid' }] }, { label: 'Select', icon: ic('check', 18) }, '-', { label: 'Delete', icon: ic('trash', 18), red: true }],
  { key: 'options', name: 'Options menu', onPick: it => Parts.toast((it.parent ? it.parent + ': ' : '') + it.label) }));
(() => { const slot = $('#mzslot'), btn = $('#mzBtn'); let shown = true;
  btn.addEventListener('click', () => {
    if (shown) { shown = false; btn.textContent = 'Show'; const g = slot.firstElementChild; if (g) Parts.leave(g, { key: 'star' }); }
    else { shown = true; btn.textContent = 'Hide'; slot.innerHTML = `<button class="pk-btn pk-circle gal-mz pk-glass pk-press" data-name="Appearing glass" aria-label="Star">${ic('star', 26)}</button>`; Parts.appear(slot.firstElementChild, { key: 'star' }); } }); })();

/* ==BEHAVIOUR== */

/* ---------- the prototype kit: frame, look, motion and the settings both ways ---------- */
const settingControls = [
  { name: 'Reduce transparency', options: ['Off', 'On'], onChange: i => app.classList.toggle('glass-solid', i === 1) },
  { name: 'Jump to', options: ['Top'].concat(SECTIONS.map(s => s.title)), onChange: i => { const pg = $('#pg'); if (!i) { pg.scrollTo({ top: 0 }); return; } pg.scrollTo({ top: Math.max(0, $('#s-' + SECTIONS[i - 1].id).offsetTop - 96) }); } },
  { name: 'Tab bar folds (D01)', options: ['Off', 'On'], onChange: i => Parts.settings({ tabBar: { fold: i === 1 } }) },
  { name: 'Search gap (D02)', options: ['8', '12'], onChange: i => Parts.settings({ tabBar: { searchGap: i ? 12 : 8 } }) },
  { name: 'Segmented (D04)', options: ['Gallery', 'Squish'], onChange: i => Parts.settings({ segmented: { style: i ? 'squish' : 'gallery' } }) },
  { name: 'Row press (D06)', options: ['Highlight', 'Shrink'], onChange: i => Parts.settings({ row: { press: i ? 'shrink' : 'highlight' } }) },
  { name: 'Choices (D07)', options: ['Action sheet', 'Sheet'], onChange: i => Parts.settings({ choices: i ? 'sheet' : 'actionSheet' }) },
  { name: 'Confirm (D08)', options: ['Alert', 'Sheet'], onChange: i => Parts.settings({ confirm: i ? 'sheet' : 'alert' }) },
  { name: 'Sheet drag (D14)', options: ['Follows', 'Shrinks'], onChange: i => Parts.settings({ sheet: { dragShrink: i === 1 } }) },
  { name: 'Sheet glass (D15)', options: ['Strong', 'Regular'], onChange: i => Parts.settings({ sheet: { glass: i ? 'regular' : 'strong' } }) },
  { name: 'Pinned parts (D11–D13)', options: ['On', 'Off'], onChange: i => Parts.settings(i ? { menu: { submenus: [] }, glass: { appear: [] }, press: { glint: [] } } : PINNED) }
];
window.Kit.start({ app: 'Parts kit', title: 'parts gallery', id: 'parts-gallery-v1', screen: '', version: '2', controls: settingControls });
// the prototype kit's Look and Motion drive the parts kit
let seen = {};
function follow(d) {
  if (!d) return;
  const dark = d.look === 1; app.classList.toggle('pk-dark', dark); app.classList.toggle('pk-light', !dark);
  if (d.motion !== seen.motion) { Parts.motion.setSpeed(d.motion === 1 ? 4 : 1); Parts.motion.setReduced(d.motion === 2); }
  seen = d;
}
window.addEventListener('kit:change', e => follow(e.detail));
follow(window.Kit.get && window.Kit.get());
window.Kit.inspect(false);
window.Gallery = { $, $$ };
})();
</script>
