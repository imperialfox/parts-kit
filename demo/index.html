<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Parts gallery · Liquid Glass</title>
<link rel="stylesheet" href="vendor/prototype-kit/kit.css">
<link rel="stylesheet" href="../parts-kit.css">
<style id="gallery-css">
/* The gallery's own page: everything here is the demo, not the kit. The parts themselves come from parts-kit.css. */
#app{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--fg);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app *{box-sizing:border-box}
#app input,#app textarea{-webkit-user-select:text;user-select:text}
#app .gal-page{position:absolute;inset:0;overflow-y:auto;overflow-x:clip;padding:104px 16px 140px;background:var(--bg)}
.is-ipad #app .gal-page{padding:110px 40px 150px}
#app .gal-wrap{max-width:600px;margin:0 auto}
#app .gal-sub{font-size:15px;color:var(--fg2);margin:4px 0 6px}
#app .gal-legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
#app .gal-sh{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--fg2);margin:34px 4px 0;scroll-margin-top:100px}
#app .gal-part{margin-top:14px;scroll-margin-top:110px}
#app .gal-ph{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
#app .gal-pn{flex:none;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
#app .gal-pt{font-size:17px;font-weight:600;flex:1;min-width:0}
#app .gal-src{flex:none;font-size:11px;font-weight:600;padding:3px 8px;border-radius:9px}
#app .gal-src.m{background:rgba(52,199,89,.16);color:#248a3d}
#app .gal-src.e{background:var(--fill);color:var(--fg2)}
#app .gal-src.mx{background:rgba(255,159,10,.16);color:#c26a00}
#app .gal-src.pin{background:rgba(88,86,214,.16);color:#5856d6}
.pk-dark#app .gal-src.m{color:#30d158}.pk-dark#app .gal-src.mx{color:#ff9f0a}.pk-dark#app .gal-src.pin{color:#7d7aff}
#app .gal-pv{font-size:13px;color:var(--fg2);margin:8px 4px 0;line-height:1.35}
#app .gal-pv code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--fill);padding:1px 4px;border-radius:4px}
#app .gal-empty{display:none;text-align:center;color:var(--fg2);margin:60px 0}
#app .gal-foot{font-size:13px;color:var(--fg2);text-align:center;margin:40px 8px 0;line-height:1.4}
#app .gal-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#app .gal-col{display:flex;flex-direction:column;gap:12px;width:100%;align-items:center}
/* colourful content for glass to sit on */
#app .gal-stage{position:relative;border-radius:22px;padding:18px 16px;min-height:120px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;overflow:hidden;isolation:isolate;
 background:radial-gradient(circle at 12% 22%,#ff9f0a 0,transparent 36%),radial-gradient(circle at 85% 18%,#5e5ce6 0,transparent 42%),radial-gradient(circle at 62% 92%,#30d158 0,transparent 40%),radial-gradient(circle at 22% 95%,#ff375f 0,transparent 34%),linear-gradient(135deg,#64d2ff,#bf5af2)}
.pk-dark#app .gal-stage{background:radial-gradient(circle at 12% 22%,#c25e00 0,transparent 36%),radial-gradient(circle at 85% 18%,#3634a3 0,transparent 42%),radial-gradient(circle at 62% 92%,#1a7f37 0,transparent 40%),radial-gradient(circle at 22% 95%,#b0153b 0,transparent 34%),linear-gradient(135deg,#0b4f7a,#4b1d6e)}
#app .gal-stage .gal-words{position:absolute;inset:0;z-index:-1;padding:8px 12px;font-size:20px;font-weight:800;line-height:1.15;color:rgba(255,255,255,.55);overflow:hidden;pointer-events:none;letter-spacing:-.01em}
#app .gal-stage .gal-words b{color:rgba(0,0,0,.5);font-weight:800}
#app .gal-stage.tall{min-height:170px}
#app .gal-mat{width:120px;height:80px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}

/* small scrolling pages inside a part */
#app .gal-mini{position:relative;height:250px;border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 .5px var(--sep)}
#app .gal-mini .pk-topbar{height:76px;--pk-bar-top:6px}
#app .gal-mini .pk-bar-slot.pk-left{left:8px}#app .gal-mini .pk-bar-slot.pk-right{right:8px}
#app .gal-mini .pk-scroll{position:absolute;inset:0;overflow-y:auto;padding:52px 14px 20px}
#app .gal-mini .gal-mlt{font-size:34px;font-weight:700;margin:0 0 10px}
#app .gal-mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep)}
#app .gal-colorrow{height:64px;border-radius:14px;margin:0 0 10px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:20px}
#app .gal-tile{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
#app .gal-mbar{position:relative;width:100%;height:44px}
#app .gal-mbar .pk-bar-slot{top:0}
#app .gal-mbar .gal-ttl{position:absolute;left:60px;right:60px;top:0;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25)}
#app .pk-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#app .gal-sq{width:44px;height:44px;border-radius:12px}
#app .gal-pill132{width:132px;padding:0}
/* iPad: the dock centred, the top bar's buttons further in (as an app would set for itself) */
.is-ipad #app{--pk-bar-top:40px}
.is-ipad #app #dock{left:50%;right:auto;width:520px;margin-left:-260px;bottom:24px}
.is-ipad #app #topbar .pk-bar-slot.pk-right{right:40px}
#app .gal-pad{width:220px;height:72px;border-radius:999px;font-weight:600;touch-action:none}
#app .gal-mz{width:64px;height:64px}
#app .gal-mzslot{width:64px;height:64px}
/* part 4's Tune panel (the gallery's own tool for tuning the bubble again; not part of the kit) */
#app .gal-tune{margin-top:10px;padding:12px 16px 14px;border-radius:var(--r-card);background:var(--surface)}
#app .gal-tune[hidden]{display:none}
#app .gal-tune h3{margin:16px 0 2px;font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--fg2)}
#app .gal-tune h3:first-child{margin-top:2px}
#app .gal-tb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#app .gal-tb .pk-btn{flex:1;min-width:120px;font-size:15px;padding:0 12px}
#app .gal-sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0 12px}
#app .gal-sl label{font-size:15px}
#app .gal-sl small{grid-column:1/3;font-size:12px;color:var(--fg2);line-height:1.3}
#app .gal-sl input{grid-column:1/3;width:100%;accent-color:var(--accent)}
#app .gal-nv{display:flex;align-items:center;gap:6px}
#app .gal-nv button{width:30px;height:26px;border:0;border-radius:999px;background:var(--fill);font:600 16px/1 inherit;color:var(--fg);padding:0}
#app .gal-nv output{min-width:64px;text-align:center;font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2)}
#app .gal-sl.gal-off{opacity:.4}
#app .gal-meter{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg2);margin:4px 0 0}
#app .gal-copy{width:100%;height:90px;margin-top:6px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border-radius:10px;border:.5px solid var(--sep);background:var(--bg);color:var(--fg);padding:6px}
#app .gal-mk{position:absolute;z-index:9;pointer-events:none;display:none}
#app .gal-showmk .gal-mk{display:block}
#app .gal-mk.a{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #ff3b30;background:rgba(255,59,48,.18)}
#app .gal-mk.a::before,#app .gal-mk.a::after{content:'';position:absolute;background:#ff3b30}
#app .gal-mk.a::before{left:50%;top:-7px;bottom:-7px;width:1px;margin-left:-.5px}
#app .gal-mk.a::after{top:50%;left:-7px;right:-7px;height:1px;margin-top:-.5px}
#app .gal-mk.l{top:-6px;height:76px;border-left:2px dashed #ff3b30;margin-left:-1px;opacity:.7}
#app .gal-mk.i{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:3px;border:2px solid #007aff;background:rgba(0,122,255,.18);transform:rotate(45deg)}
</style>
</head>
<body>
<div id="app" data-name="Parts gallery">
  <section class="gal-page pk-scroll" id="pg" data-name="Gallery page"><div class="gal-wrap" id="wrap"></div></section>
  <section class="pk-push" id="push" data-under="#pg" data-name="10 · Pushed page">
    <div class="pk-bar-slot pk-left"><button class="pk-btn pk-circle pk-glass pk-press" id="pushBack" data-name="Back button" aria-label="Back"></button></div>
    <div style="padding:104px 16px 40px"><h1 class="pk-large-title">Pushed page</h1>
    <p class="gal-sub">Swipe right from anywhere on this page, or tap Back.</p>
    <div class="pk-list" style="margin-top:18px"><div class="pk-row"><span class="pk-row-text">The page underneath moved a third to the left and dimmed.</span></div><div class="pk-row"><span class="pk-row-text">Spring: ζ 0.86, 2.2 Hz (the nav spring).</span></div></div></div>
  </section>
  <header class="pk-topbar" id="topbar" data-name="2 · Top bar (this screen's)"><div class="pk-edge"></div><div class="pk-topbar-title">Parts</div><div class="pk-bar-slot pk-right"><button class="pk-btn pk-circle pk-glass pk-press" id="moreBtn" data-name="More button" aria-label="More"></button></div></header>
  <div class="pk-dock" id="dock" data-name="4 · Tab bar (this screen's)"></div>
</div>
<script src="vendor/prototype-kit/kit.js"></script>
<script src="../parts-kit.js"></script>
<script id="gallery-js">
(function(){
'use strict';
const app = document.getElementById('app');
const $ = (s, r) => (r || app).querySelector(s);
const $$ = (s, r) => Array.from((r || app).querySelectorAll(s));

/* ---------- the gallery's settings: the kit's defaults, with the pinned parts switched on for their demos ---------- */
const PINNED = { menu: { submenus: ['options'] }, glass: { appear: ['star'] }, press: { glint: ['pad'] } };
Parts.settings(Object.assign({ app: 'Parts gallery', root: '#app', sheet: { withStops: ['stops', 'grows'], growsToFull: ['grows'], fullScreen: ['cover'] } }, PINNED));

/* ---------- icons ---------- */
const PATHS = {
  chevL:'M15 5l-7 7 7 7', chevR:'M9 5l7 7-7 7', chevD:'M6 9l6 6 6-6', plus:'M12 5v14M5 12h14', minus:'M5 12h14', x:'M6 6l12 12M18 6L6 18',
  search:'M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM15.5 15.5L20 20', home:'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z',
  grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z', list:'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01',
  layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5', sliders:'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',
  heart:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z', share:'M12 3v12M8 7l4-4 4 4M5 12v7h14v-7',
  trash:'M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13', star:'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z',
  bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0', flag:'M5 21V4M5 4h11l-2 4 2 4H5', pencil:'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3',
  mic:'M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3', bold:'M7 4h6a4 4 0 0 1 0 8H7zM7 12h7a4 4 0 0 1 0 8H7z',
  italic:'M10 4h8M6 20h8M14 4l-4 16', under:'M7 4v7a5 5 0 0 0 10 0V4M5 21h14',
  note:'M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z', check:'M5 12l5 5 9-10', cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
  person:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0', grip:'M5 9h14M5 15h14', gear:'M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1',
  copy:'M8 8h12v12H8zM4 16V4h12', book:'M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 5v16', clock:'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM12 7v5l3 2'
};
function ic(n, s, w) { s = s || 22; w = w || 2;
  if (n === 'more') return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>`;
  if (n === 'play') return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${PATHS[n]}"/></svg>`;
}

/* ---------- gallery building blocks ---------- */
const SECTIONS = [], NUMS = [];
const SRC = { m: 'Measured', e: 'By eye', mx: 'Partly measured', pin: 'Pinned' };
function sec(id, title) { SECTIONS.push({ id, title }); return `<h2 class="gal-sh" id="s-${id}" data-sec="${id}">${title}</h2>`; }
function part(n, title, src, vals, demo) { NUMS.push(n); return `<section class="gal-part" id="p${n}" data-n="${n}" data-name="${n} · ${title}" data-q="${(n + ' ' + title).toLowerCase()}">
  <div class="gal-ph"><span class="gal-pn">${n}</span><span class="gal-pt">${title}</span><span class="gal-src ${src}">${SRC[src]}</span></div>${demo}<p class="gal-pv">${vals}</p></section>`; }
const words = `<div class="gal-words">The quick brown fox <b>jumps</b> over the lazy dog. Glass over <b>content</b>. The quick brown <b>fox</b> jumps over the lazy dog. Glass over content. The <b>quick</b> brown fox jumps.</div>`;
const stage = (inner, cls, name) => `<div class="gal-stage ${cls || ''}" data-name="${name || 'Backdrop'}">${words}${inner}</div>`;

let H = `<div data-name="Header"><h1 class="pk-large-title" data-name="Large title">Parts</h1>
<p class="gal-sub">Every part in parts kit ${Parts.version}, with its number from the first gallery. Sample content only.</p>
<div class="gal-legend"><span class="gal-src m">Measured</span><span class="gal-src mx">Partly measured</span><span class="gal-src e">By eye</span><span class="gal-src pin">Pinned</span></div>
<p class="gal-pv" style="margin:6px 4px 0">Measured = timed against a real iPhone by the authors of liquid_glass_widgets. By eye = their tuning. Pinned = built and ready, switched off in an app until it's placed. The controls panel switches each setting both ways.</p></div>`;


const tabsHTML = (tabs, on) => `<nav class="pk-tabbar pk-glass" data-name="Tab bar"><span class="pk-tab-ind" data-name="Picked tab highlight"></span>${tabs.map((t, i) => `<button class="pk-tab${i === (on || 0) ? ' on' : ''}" data-name="Tab: ${t[1]}">${ic(t[0], 24)}<span>${t[1]}</span></button>`).join('')}</nav>`;
const searchHTML = (ph, id) => `<button class="pk-btn pk-search-circle pk-glass pk-press" data-name="Search circle" aria-label="Search">${ic('search', 24)}</button>
  <div class="pk-search-field pk-glass" data-name="Search field">${ic('search', 18)}<input ${id ? `id="${id}"` : ''} placeholder="${ph}" aria-label="${ph}"></div><button class="pk-btn pk-search-close pk-glass pk-press" data-name="Close search" aria-label="Close search">${ic('x', 18)}</button>`;
const TABS = [['layers', 'Bars'], ['sliders', 'Controls'], ['list', 'Lists'], ['copy', 'Overlays']];
const row = (title, sub, tile, extra, tag) => { tag = tag || 'div'; return `<${tag} class="pk-row${tag === 'button' ? ' pk-tap' : ''}" data-name="Row: ${title}">${tile ? `<span class="pk-tile" style="background:${tile[1]}">${ic(tile[0], 20)}</span>` : ''}<span class="pk-row-text">${title}${sub ? `<small>${sub}</small>` : ''}</span>${extra || ''}</${tag}>`; };
const chev = `<span class="pk-chev">${ic('chevR', 18)}</span>`;

H += sec('glass', 'Glass');
H += part(1, 'Glass material', 'm', 'Regular: tint 53% light / 12% dark, saturation 2.1 / 1.4, blur 14. Rim lit from the top in light, from the bottom in dark; shadow only in light. Strong is for sheets. Clear is glass inside glass: a see-through fill with the rim and no second blur. Reduce transparency (controls) makes the tint more solid and keeps the blur. <code>.pk-glass</code> <code>.pk-strong</code> <code>.pk-clear</code>',
  stage(`<div class="pk-glass gal-mat" data-name="Regular glass">Regular</div><div class="pk-glass pk-strong gal-mat" data-name="Strong glass">Strong</div><div class="pk-glass gal-mat" style="display:flex;flex-direction:column;gap:6px" data-name="Glass holding clear glass">Holder<span class="pk-clear" style="border-radius:999px;padding:4px 12px;font-size:13px" data-name="Clear glass">Clear</span></div>`, 'tall'));

H += sec('bars', 'Bars');
H += part(2, 'Top bar and soft edge', 'e', 'No card of its own. After 36 pt of scrolling the soft edge (51) fades in (100 pt, fade 1 · .70 · .30 · .04 · 0) with the small title. Circle buttons 44 pt. Scroll inside the box. <code>.pk-topbar</code> beside a <code>.pk-scroll</code>',
  `<div class="gal-mini" data-name="Small scrolling page"><header class="pk-topbar" data-name="Top bar"><div class="pk-edge"></div><div class="pk-bar-slot pk-left"><button class="pk-btn pk-circle pk-glass pk-press" data-name="Back button" aria-label="Back">${ic('chevL')}</button></div><div class="pk-topbar-title">Library</div><div class="pk-bar-slot pk-right"><button class="pk-btn pk-circle pk-glass pk-press" data-name="More button" aria-label="More">${ic('more')}</button></div></header>
  <div class="pk-scroll"><div class="gal-mlt">Library</div>${['Morning notes', 'Weekly plan', 'Recipes', 'Reading list', 'Ideas', 'Travel', 'Receipts', 'Workouts', 'Films', 'Gifts'].map((t, i) => `<div class="gal-mrow"><span class="gal-tile" style="background:var(--sys-${['blue', 'orange', 'green', 'purple', 'pink', 'teal', 'indigo', 'red', 'mint', 'yellow'][i]})">${ic(['note', 'cal', 'book', 'star', 'heart', 'flag', 'copy', 'clock', 'play', 'bell'][i], 18)}</span>${t}</div>`).join('')}</div></div>`);
H += part(51, 'Soft edge under bars', 'e', 'Soft (what iOS mostly uses): the page colour fading out, not a blur. Blur: three stacked blurs, strongest at the top (σ 18 → 6 → 2). Bottom edges are 60 pt. Scroll the box, then switch. <code>.pk-edge</code> <code>.pk-edge-blur</code> <code>.pk-edge-bottom</code>',
  `<div class="pk-seg" id="edgeSeg" style="margin-bottom:10px" data-name="Segmented: Soft Blur"><span class="pk-seg-ind"></span><button class="on">Soft</button><button>Blur</button></div>
  <div class="gal-mini" id="edgeMini" data-name="Soft edge sample"><header class="pk-topbar pk-edge-on" style="height:100px" data-name="Top bar"><div class="pk-edge"></div><div class="pk-edge-blur" style="display:none"><i></i><i></i><i></i></div><div class="pk-topbar-title" style="opacity:1">Photos</div></header>
  <div class="pk-scroll" style="padding-top:60px">${[['Sunrise', '#ff9f0a'], ['Ocean', '#0a84ff'], ['Forest', '#30d158'], ['Berry', '#ff375f'], ['Dusk', '#5e5ce6'], ['Sand', '#c69c6d'], ['Mint', '#00c7be']].map(c => `<div class="gal-colorrow" style="background:${c[1]}">${c[0]}</div>`).join('')}</div><div class="pk-edge-bottom"></div></div>`);
H += part(3, 'Large title', 'e', 'Large title 34 pt bold with a Footnote date line above. Folds into the 17 pt title in the top bar. <code>.pk-large-title</code> <code>.pk-date-line</code>',

  { name: 'Tab bar folds (D01)', options: ['Off', 'On'], onChange: i => Parts.settings({ tabBar: { fold: i === 1 } }) },
  { name: 'Tab bar bubble', options: ['On', 'Off'], onChange: i => Parts.settings({ tabBar: { bubble: { on: i === 0 } } }) },
  { name: 'Search gap (D02)', options: ['8', '12'], onChange: i => Parts.settings({ tabBar: { searchGap: i ? 12 : 8 } }) },
  { name: 'Segmented (D04)', options: ['Gallery', 'Squish'], onChange: i => Parts.settings({ segmented: { style: i ? 'squish' : 'gallery' } }) },
  { name: 'Row press (D06)', options: ['Highlight', 'Shrink'], onChange: i => Parts.settings({ row: { press: i ? 'shrink' : 'highlight' } }) },
  { name: 'Choices (D07)', options: ['Action sheet', 'Sheet'], onChange: i => Parts.settings({ choices: i ? 'sheet' : 'actionSheet' }) },
  { name: 'Confirm (D08)', options: ['Alert', 'Sheet'], onChange: i => Parts.settings({ confirm: i ? 'sheet' : 'alert' }) },
  { name: 'Sheet drag (D14)', options: ['Follows', 'Shrinks'], onChange: i => Parts.settings({ sheet: { dragShrink: i === 1 } }) },
  { name: 'Sheet glass (D15)', options: ['Strong', 'Regular'], onChange: i => Parts.settings({ sheet: { glass: i ? 'regular' : 'strong' } }) },
  { name: 'Pinned parts (D11–D13)', options: ['On', 'Off'], onChange: i => Parts.settings(i ? { menu: { submenus: [] }, glass: { appear: [] }, press: { glint: [] } } : PINNED) }
];
window.Kit.start({ app: 'Parts kit', title: 'parts gallery', id: 'parts-gallery-v1', screen: '', version: '2', controls: settingControls });
// the prototype kit's Look and Motion drive the parts kit
let seen = {};
function follow(d) {
  if (!d) return;
  const dark = d.look === 1; app.classList.toggle('pk-dark', dark); app.classList.toggle('pk-light', !dark);
  if (d.motion !== seen.motion) { Parts.motion.setSpeed(d.motion === 1 ? 4 : 1); Parts.motion.setReduced(d.motion === 2); }
  seen = d;
}
window.addEventListener('kit:change', e => follow(e.detail));
follow(window.Kit.get && window.Kit.get());
window.Kit.inspect(false);
window.Gallery = { $, $$ };
})();
</script>
