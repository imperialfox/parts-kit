/* Skeleton view */

  --shadow-lifted: 0 8px 24px rgba(0, 0, 0, 0.18); /* a lifted card or row */
  --shadow-floating: 0 8px 33px rgba(0, 0, 0, 0.08); /* menus, popovers, toasts */
  --shadow-glow: 0 0 22px rgba(0, 122, 255, 0.35); /* a part calling attention to itself */

}

/* DEFAULTS · shapes, motion and layout (the same in every look) */
:where(:root) {
  /* corners */
  --r-small: 10px; /* icon tiles, badges, small inner boxes */
  --r-medium: 14px; /* fields, inner boxes, menu rows */
  --r-card: 20px; /* cards, grouped lists, menus (D16) */
  --r-large: 26px; /* big blocks, glass cards, popovers */
  --r-sheet: 46px; /* sheets and covers: the screen's own corners (D17) */
  --r-alert: 34px;
  --r-actions: 28px; /* action sheet groups */

  /* press */
  --press: 0.93; /* solid buttons */
  --press-row: 0.98; /* rows, when row.press is 'shrink' */
  --pk-knob-grow: 1.35; /* a switch or slider knob while held */
  --pk-lift-scale: 1.04; /* (M) a held row lifting before its menu */
  --pk-recede: 0.971; /* (M) a menu behind its submenu */

  /* easings (fixed curves; the springs are --ease-gentle … published by the motion core) */
  --ease-pop: cubic-bezier(0.3, 1.7, 0.45, 1); /* the solid press settle */
  --ease-knob: cubic-bezier(0.3, 1.35, 0.5, 1); /* the squish knob's settle */
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1); /* one settle without a bounce; fades */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* the switch */
  --ease-decel: cubic-bezier(0.33, 1, 0.68, 1); /* arriving: toasts, action sheets, lifts */
  --ease-accel: cubic-bezier(0.32, 0, 0.67, 0); /* leaving */
  --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1); /* the slider knob */
  --ease-lift: cubic-bezier(0, 0, 0.58, 1); /* the press light coming up */
  --ease-linear: linear;
  --ease-steps: steps(8); /* the spinner */

  /* durations (fixed; multiplied by the motion speed where used) */
  --dur-quick: 120ms;
  --dur-fade: 200ms;
  --dur-lift-in: 150ms;
  --dur-lift-out: 60ms;
  --dur-switch: 380ms;
  --dur-knob: 150ms;
  --dur-squish: 450ms;
  --dur-appear: 250ms;
  --dur-leave: 350ms;
  --dur-cover: 500ms;
  --dur-toast-in: 500ms;
  --dur-toast-out: 350ms;
  --dur-close: 170ms; /* menus closing */
  --dur-ramp: 260ms; /* a blur fading in */
  --dur-lift-row: 360ms; /* a held row lifting */
  --dur-recede: 320ms; /* a menu behind its submenu */
  --dur-reduced: 100ms; /* Reduce Motion: the short fade that replaces movement */
  --dur-glint: 500ms;
  --dur-progress: 600ms;
  --dur-spin: 1s;
  --dur-rise: 350ms; /* action sheets rising */
  --dur-morph: 420ms; /* (M) a top bar button changing icon: the gel swell and the icons' blur */

  /* spring stand-ins until the motion core publishes the real ones (--ease-<name>, --dur-<name>) */
  --ease-gentle: var(--ease-out);
  --ease-nav: var(--ease-out);
  --ease-ripple: var(--ease-out);
  --ease-press: var(--ease-out);
  --ease-release: var(--ease-out);
  --ease-snap: var(--ease-out);
  --ease-bloom: var(--ease-out);
  --ease-settle: var(--ease-out);
  --ease-pill: var(--ease-out);
  --ease-sheet: var(--ease-out);
  --ease-menu-open: var(--ease-out);
  --ease-menu-close: var(--ease-out);
  --dur-gentle: 0ms;
  --dur-nav: 0ms;
  --dur-ripple: 0ms;
  --dur-press: 0ms;
  --dur-release: 0ms;
  --dur-snap: 0ms;
  --dur-bloom: 0ms;
  --dur-settle: 0ms;
  --dur-pill: 0ms;
  --dur-sheet: 0ms;
  --dur-menu-open: 0ms;
  --dur-menu-close: 0ms;

  /* layout */
  --dockb: 21px;
  --dockl: 21px;
  --dockr: 21px;
  --pk-search-gap: 8px; /* tabBar.searchGap (D02) */
  --pk-kb-gap: 8px; /* (6) how far the searching dock sits above the iPhone keyboard */
  --pk-kb: 0px; /* (6) how far the keyboard has lifted the searching dock (set by parts-kit.js) */
  --pk-bar-top: 54px; /* where the top bar's buttons sit (below the status bar) */
  --pk-speed: 1; /* the motion speed: 1 normal, 4 slow, 0 off (set by parts-kit.js) */
}

/* END OF DEFAULTS */

/* blur ramps need a registered property; where it's missing the blur simply starts full */
@property --pk-ramp {
  syntax: '<length>';
  inherits: false;
  initial-value: 0px;
}

/* ===================================================================================================================
   FOUNDATIONS
   =================================================================================================================== */
:where(.pk-btn, .pk-tab, .pk-chip, .pk-menu-item, .pk-action, .pk-alert-btn, .pk-toast-undo, .pk-seg > button, .pk-stepper > button, .pk-field-clear, button.pk-row, .pk-swipe-actions > button) {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
:where([class^='pk-'], [class*=' pk-']) {
  box-sizing: border-box;
}
:where([class^='pk-'], [class*=' pk-']) svg {
  display: block;
  flex: none;
}

/* (1) the glass material. Glass goes on the control layer only (bars, buttons, sheets, toasts); lists stay solid */
.pk-glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: var(--glass-rim), var(--glass-float);
  isolation: isolate;
}
:where(.pk-glass, .pk-clear) {
  position: relative;
}
/* the hairline: 0.5 pt, darkest across the light's direction and fading where the light hits */
.pk-glass::before,
.pk-clear::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 0.5px;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(var(--glass-line-end), var(--glass-line) 30%, var(--glass-line) 70%, var(--glass-line-end));
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}
.pk-glass.pk-strong {
  background: var(--glass-strong);
}
.pk-glass.pk-tinted,
.pk-clear.pk-tinted {
  background: var(--tint);
  color: var(--on-accent);
}
.pk-clear {
  background: var(--pk-clear);
  box-shadow: var(--glass-rim);
  isolation: isolate;
}
/* Reduce transparency: the tint more solid, the blur kept (html.glass-solid, or any ancestor with it) */
.glass-solid .pk-glass:not(.pk-strong, .pk-tinted) {
  background: var(--glass-rt);
}

/* the press. parts-kit.js measures the button and sets --pk-ps:
   .pk-press grows by 17 pt along its longest side and lights up (glass buttons);
   .pk-press-bar only lights up (buttons on a glass bar);
   .pk-press-solid shrinks to --press (solid buttons) */
.pk-press,
.pk-press-bar,
.pk-press-solid {
  scale: var(--pk-ps, 1);
  translate: var(--pk-tx, 0px) var(--pk-ty, 0px);
  transition: scale var(--dur-release) var(--ease-release), translate var(--dur-release) var(--ease-release);
}
:where(.pk-press, .pk-press-bar, .pk-press-solid) {
  position: relative;
  isolation: isolate;
}
.pk-press.pk-pressed,
.pk-press-bar.pk-pressed {
  z-index: 20;
  transition: scale var(--dur-press) var(--ease-press), translate var(--dur-press) var(--ease-press);
}
.pk-press-solid.pk-pressed {
  --pk-ps: var(--press);
  transition: scale calc(var(--dur-quick) * var(--pk-speed)) var(--ease-pop);
}
.pk-press::after,
.pk-press-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  z-index: -1;
  pointer-events: none;
  background: var(--lift-max);
  opacity: 0;
  transition: opacity calc(var(--dur-lift-out) * var(--pk-speed)) var(--ease-linear);
}
.pk-pressed::after {
  opacity: 1;
  transition: opacity calc(var(--dur-lift-in) * var(--pk-speed)) var(--ease-lift);
}
.pk-press-solid::after {
  content: none;
}
.motion-reduced :is(.pk-press, .pk-press-bar, .pk-press-solid) {
  scale: none;
  translate: none;
}
/* (52, pinned) the finger glint: a soft glow under the finger, on buttons named in press.glint */
.pk-glint {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
  background: radial-gradient(closest-side, var(--pk-glint), transparent);
  filter: blur(8px);
  mix-blend-mode: plus-lighter;
  opacity: 0;
  transition: opacity calc(var(--dur-glint) * var(--pk-speed)) var(--ease-out);
}
.pk-pressed.pk-glinting > .pk-glint-clip > .pk-glint {
  opacity: 1;
  transition: opacity calc(var(--dur-lift-in) * var(--pk-speed)) var(--ease-out);
}
.pk-glint-clip {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

/* the shared shapes */
.pk-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--fg);
  flex: none;
}
.pk-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
}
.pk-circle.pk-sm {
  width: 36px;
  height: 36px;
}
.pk-circle.pk-lg {
  width: 56px;
  height: 56px;
}
.pk-pill {
  height: 44px;
  padding: 0 22px;
  border-radius: 999px;
  font-weight: 600;
}
.pk-cta {
  height: 50px;
  padding: 0 22px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 17px;
}
.pk-cta.pk-wide {
  width: 100%;
}
.pk-btn.pk-tinted {
  color: var(--on-accent);
}
.pk-btn.pk-solid {
  background: var(--fg);
  color: var(--bg);
}
.pk-btn.pk-text {
  color: var(--accent);
  font-size: 17px;
  height: 34px;
  padding: 0 4px;
}
.pk-btn:disabled {
  opacity: 0.5;
  cursor: default;
}

/* layers for overlays: parts-kit.js puts one inside the root (the page, or the app's own root) */
.pk-layer {
  position: absolute;
  inset: 0;
  z-index: 60;
  pointer-events: none;
}
body > .pk-layer {
  position: fixed;
}
.pk-layer > * {
  pointer-events: auto;
}
.pk-dim {
  position: absolute;
  inset: 0;
  background: var(--pk-dim);
  opacity: 0;
  transition: opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-dim.pk-soft {
  background: var(--pk-dim-light);
}
.pk-dim.pk-clear-dim {
  background: transparent;
}
.pk-dim.pk-on {
  opacity: 1;
}

/* ===================================================================================================================
   GLASS, BARS AND BUTTONS
   =================================================================================================================== */

/* (2) top bar: no card of its own. After 36 pt of scrolling the soft edge and the small title fade in.
   Put .pk-topbar beside the .pk-scroll it belongs to (same parent). */
.pk-topbar {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 100px;
  z-index: 30;
  pointer-events: none;
}
.pk-topbar-title {
  position: absolute;
  left: 70px;
  right: 70px;
  top: var(--pk-bar-top);
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 17px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transition: opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-bar-slot {
  position: absolute;
  top: var(--pk-bar-top);
  height: 44px;
  display: flex;
  gap: 8px;
  pointer-events: auto;
}
.pk-bar-slot.pk-left {
  left: 16px;
}
.pk-bar-slot.pk-right {
  right: 16px;
}
.pk-bar-slot > .pk-btn {
  position: relative;
}
/* (51) the soft edge: mostly a fade of the page colour, not a blur (100 pt at the top, 60 pt at the bottom) */
.pk-edge {
  position: absolute;
  inset: 0;
  background: var(--bg);
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.7) 15%, rgba(0, 0, 0, 0.3) 45%, rgba(0, 0, 0, 0.04) 75%, transparent 92%);
  mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.7) 15%, rgba(0, 0, 0, 0.3) 45%, rgba(0, 0, 0, 0.04) 75%, transparent 92%);
}
.pk-edge.pk-text-heavy {
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.9) 30%, rgba(0, 0, 0, 0.5) 60%, rgba(0, 0, 0, 0.04) 85%, transparent 95%);
  mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.9) 30%, rgba(0, 0, 0, 0.5) 60%, rgba(0, 0, 0, 0.04) 85%, transparent 95%);
}
.pk-edge-bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 60px;
  background: var(--bg);
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0, 0, 0, 0.7) 15%, rgba(0, 0, 0, 0.3) 45%, rgba(0, 0, 0, 0.04) 75%, transparent 92%);
  mask-image: linear-gradient(to top, #000 0%, rgba(0, 0, 0, 0.7) 15%, rgba(0, 0, 0, 0.3) 45%, rgba(0, 0, 0, 0.04) 75%, transparent 92%);
}
/* the blur kind of edge: three stacked blurs, strongest at the top (σ 18 → 6 → 2) */
.pk-edge-blur {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-edge-blur > i {
  position: absolute;
  inset: 0;
}
.pk-edge-blur > i:nth-child(1) {
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 35%);
  mask-image: linear-gradient(to bottom, #000 0%, transparent 35%);
}
.pk-edge-blur > i:nth-child(2) {
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 65%);
  mask-image: linear-gradient(to bottom, #000 0%, transparent 65%);
}
.pk-edge-blur > i:nth-child(3) {
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
  -webkit-mask-image: linear-gradient(to bottom, #000 20%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 20%, transparent 100%);
}
.pk-topbar.pk-scrolled :is(.pk-edge, .pk-edge-blur, .pk-topbar-title),
.pk-topbar.pk-edge-on :is(.pk-edge, .pk-edge-blur) {
  opacity: 1;
}

/* (3) large title, with an optional date line above */
.pk-large-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.2;
  margin: 0;
}
.pk-date-line {
  font-size: 13px;
  color: var(--fg2);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

/* (4) the tab bar: a 64 pt glass capsule. The picked tab sits on a flat 10% fill; pressed it turns to clear glass and
   swells 12 × 8 pt; drag along it to switch. (6) the search circle sits 8 pt away (tabBar.searchGap, D02).
   (5) folding into a pill on scroll is off unless tabBar.fold is on (D01). */
.pk-dock {
  position: absolute;
  left: var(--dockl);
  right: var(--dockr);
  bottom: var(--dockb);
  z-index: 31;
  height: 64px;
  display: flex;
  gap: var(--pk-search-gap);
  align-items: center;
}
.pk-dock.pk-inline {
  position: relative;
  left: auto;
  right: auto;
  bottom: auto;
  width: 100%;
}
.pk-tabbar {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 64px;
  border-radius: 999px;
  display: flex;
  padding: 4px;
  touch-action: none;
  transform-origin: left center;
  transition: scale var(--dur-gentle) var(--ease-gentle), opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-tab {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--fg);
  min-width: 0;
}
.pk-tab > span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pk-tab svg {
  transition: scale calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-tab.on {
  color: var(--accent);
}
.pk-tab.pk-under svg {
  scale: 1.15;
}
/* the highlight (tab bar) and knob (segmented control) share one rule: placed by --pk-i of --pk-n */
.pk-tab-ind,
.pk-seg-ind {
  position: absolute;
  z-index: 0;
  border-radius: 999px;
  translate: calc(var(--pk-i, 0) * 100%) 0;
  scale: var(--pk-bx, 1) var(--pk-by, 1);
  transition:
    translate var(--dur-snap) var(--ease-snap),
    scale var(--dur-snap) var(--ease-snap),
    background-color var(--dur-bloom) var(--ease-bloom),
    box-shadow var(--dur-bloom) var(--ease-bloom);
}
.pk-tab-ind {
  left: 4px;
  top: 4px;
  bottom: 4px;
  width: calc((100% - 8px) / var(--pk-n, 4));
  background: var(--pk-rest);
}
.pk-tab-ind.pk-live,
.pk-seg-ind.pk-live {
  background: var(--pk-lens);
  box-shadow: inset 0 0 0 0.5px var(--glass-line), inset 0 1px 0.5px rgba(255, 255, 255, 0.5), 0 2px 10px rgba(0, 0, 0, 0.08);
}
.pk-tab-ind.pk-drag,
.pk-seg-ind.pk-drag {
  translate: var(--pk-x, 0px) 0;
  transition:
    scale var(--dur-snap) var(--ease-snap),
    background-color var(--dur-bloom) var(--ease-bloom),
    box-shadow var(--dur-bloom) var(--ease-bloom);
}
.motion-reduced :is(.pk-tab-ind, .pk-seg-ind) {
  scale: none;
  transition: none;
}
/* (5) folded: the bar shrinks into a 50 pt pill at its left */
.pk-tab-pill {
  position: absolute;
  left: 0;
  top: 7px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  color: var(--accent);
  opacity: 0;
  scale: 0.5;
  pointer-events: none;
  transition: scale var(--dur-gentle) var(--ease-gentle), opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-dock.pk-folded .pk-tabbar {
  scale: 0.16 0.78;
  opacity: 0;
  pointer-events: none;
}
.pk-dock.pk-folded .pk-tab-pill {
  opacity: 1;
  scale: 1;
  pointer-events: auto;
}
/* (6) the search circle opens into a 50 pt field on the pill spring; ✕ closes it */
.pk-search-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
}
.pk-search-field {
  position: absolute;
  left: 0;
  right: 58px;
  top: 7px;
  height: 50px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  color: var(--fg2);
  opacity: 0;
  scale: 0.3 1;
  transform-origin: right center;
  pointer-events: none;
  touch-action: pan-y;
  transition: scale var(--dur-pill) var(--ease-pill), opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-search-field input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font: inherit;
  font-size: 17px;
  color: var(--fg);
}
.pk-search-close {
  position: absolute;
  right: 0;
  top: 7px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  opacity: 0;
  scale: 0.5;
  pointer-events: none;
  transition: scale var(--dur-pill) var(--ease-pill), opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-dock .pk-tabbar,
.pk-dock .pk-search-circle {
  transition: scale var(--dur-pill) var(--ease-pill), opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-dock.pk-searching :is(.pk-search-field, .pk-search-close) {
  opacity: 1;
  scale: 1;
  pointer-events: auto;
}
.pk-dock.pk-searching :is(.pk-tabbar, .pk-search-circle, .pk-tab-pill) {
  opacity: 0;
  scale: 0.8;
  pointer-events: none;
}
/* (6) the keyboard: while searching, the dock rides --pk-kb-gap above the iPhone keyboard. parts-kit.js sets the
   lift from the visible area as the keyboard moves, so there is no transition here. */
.pk-dock.pk-kb {
  translate: 0 calc(var(--pk-kb-lift) * -1);
}

/* (10) a pushed page slides in from the right while the page underneath moves a third left and dims */
.pk-push {
  position: absolute;
  inset: 0;
  z-index: 25;
  background: var(--bg);
  overflow-y: auto;
  translate: 100% 0;
  box-shadow: var(--shadow-lifted);
  touch-action: pan-y;
  display: none;
  transition: translate var(--dur-nav) var(--ease-nav);
}
.pk-push.pk-shown {
  display: block;
}
.pk-push.pk-on {
  translate: var(--pk-px, 0px) 0;
}
.pk-pushed-under {
  translate: -33% 0;
  transition: translate var(--dur-nav) var(--ease-nav);
}
.pk-pushed-back {
  translate: 0 0;
  transition: translate var(--dur-nav) var(--ease-nav);
}
.pk-tracking {
  transition: none !important;
}
.pk-navdim {
  position: absolute;
  inset: 0;
  z-index: 24;
  background: rgba(0, 0, 0, 0.1);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-nav) var(--ease-nav);
}
.pk-navdim.pk-on {
  opacity: 1;
}
.motion-reduced .pk-pushed-under {
  translate: none;
}
.motion-reduced .pk-push {
  transition: translate 0s, opacity calc(var(--dur-reduced) * var(--pk-speed)) var(--ease-out);
}

/* (15) buttons on a bar: one glass capsule, the buttons inside only light up (never glass inside glass) */
.pk-group {
  display: inline-flex;
  border-radius: 999px;
  padding: 4px;
  gap: 2px;
}
.pk-group > .pk-btn {
  width: 52px;
  height: 44px;
  border-radius: 999px;
}
.pk-group > .pk-btn[aria-pressed='true'] {
  background: var(--pk-clear);
}

/* (17) edit button: Edit turns into Done and rows show their delete circles */
.pk-edit-del {
  flex: none;
  width: 0;
  overflow: hidden;
  display: flex;
  transition: width var(--dur-gentle) var(--ease-gentle);
}
.pk-editing .pk-edit-del {
  width: 30px;
}
.pk-edit-del > i {
  display: flex;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--danger);
  color: #fff;
  align-items: center;
  justify-content: center;
}

/* (18) chips: tap to pick; picked chips take the accent colour */
.pk-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.pk-chip {
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--fill);
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  transition:
    background-color calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out),
    color calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-chip.on {
  background: var(--accent);
  color: var(--on-accent);
}
.pk-chip.pk-chip-add {
  background: none;
  box-shadow: inset 0 0 0 1px var(--sep);
  color: var(--accent);
}

/* (19) badges: a count on a button, and a small word badge */
.pk-badged {
  position: relative;
  display: inline-flex;
}
.pk-badge {
  position: absolute;
  top: -4px;
  right: -6px;
  z-index: 25;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
  pointer-events: none;
}
.pk-tag {
  height: 22px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--tint);
  color: var(--on-accent);
  display: inline-flex;
  align-items: center;
}

/* ===================================================================================================================
   CONTROLS AND INPUTS
   =================================================================================================================== */

/* (21) switch: 64 × 28. Pressed, the knob turns to glass and swells; it travels over 380 ms. Drag it: a flick faster
   than 200 px/s decides, otherwise whichever side it's past halfway. */
.pk-switch {
  position: relative;
  display: inline-block;
  width: 64px;
  height: 28px;
  border-radius: 999px;
  background: var(--pk-switch-off);
  flex: none;
  touch-action: none;
  cursor: pointer;
  transition: background-color calc(var(--dur-switch) * var(--pk-speed)) var(--ease-in-out);
}
.pk-switch.on {
  background: var(--good);
}
.pk-switch-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 38px;
  height: 24px;
  border-radius: 999px;
  background: var(--pk-knob);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.18);
  pointer-events: none;
  translate: var(--pk-sx, 0px) 0;
  scale: var(--pk-sb, 1);
  transition:
    translate calc(var(--dur-switch) * var(--pk-speed)) var(--ease-in-out),
    scale calc(var(--dur-quick) * var(--pk-speed)) var(--ease-lift),
    background-color calc(var(--dur-quick) * var(--pk-speed)) var(--ease-out),
    box-shadow calc(var(--dur-quick) * var(--pk-speed)) var(--ease-out);
}
.pk-switch.on .pk-switch-knob {
  --pk-sx: 22px;
}
.pk-switch.pk-held .pk-switch-knob {
  --pk-sb: var(--pk-knob-grow);
  background: rgba(255, 255, 255, 0.18);
  box-shadow: inset 0 0 0 0.5px var(--glass-line), inset 0 1px 0.5px rgba(255, 255, 255, 0.6), 0 2px 8px rgba(0, 0, 0, 0.12);
}
.pk-switch.pk-dragging .pk-switch-knob {
  transition:
    scale calc(var(--dur-quick) * var(--pk-speed)) var(--ease-lift),
    background-color calc(var(--dur-quick) * var(--pk-speed)) var(--ease-out);
}
.pk-switch.pk-swell .pk-switch-knob {
  animation: pk-swell calc(var(--dur-switch) * var(--pk-speed)) var(--ease-in-out);
}
@keyframes pk-swell {
  45% {
    scale: 1.18 1.1;
  }
}
.motion-reduced .pk-switch .pk-switch-knob {
  --pk-sb: 1;
  animation: none;
  transition: background-color calc(var(--dur-reduced) * var(--pk-speed)) var(--ease-out);
}
.pk-switch:focus-visible,
.pk-slider:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* (22) slider: the knob grows ×1.35 while held (150 ms) and turns to glass; the fill follows the finger */
.pk-slider {
  position: relative;
  height: 34px;
  flex: 1;
  min-width: 80px;
  touch-action: none;
  cursor: pointer;
}
.pk-slider-track {
  position: absolute;
  left: 0;
  right: 0;
  top: 14px;
  height: 6px;
  border-radius: 3px;
  background: var(--pk-switch-off);
  overflow: hidden;
}
.pk-slider-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--pk-p, 50%);
  background: var(--accent);
}
.pk-slider-thumb {
  position: absolute;
  top: 5px;
  left: calc(var(--pk-p, 50%) - 19px);
  width: 38px;
  height: 24px;
  border-radius: 999px;
  background: var(--pk-knob);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
  pointer-events: none;
  transition:
    scale calc(var(--dur-knob) * var(--pk-speed)) var(--ease-back),
    background-color calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-slider.pk-held .pk-slider-thumb {
  scale: var(--pk-knob-grow);
  background: rgba(255, 255, 255, 0.25);
  box-shadow: inset 0 0 0 0.5px var(--glass-line), inset 0 1px 0.5px rgba(255, 255, 255, 0.6), 0 2px 8px rgba(0, 0, 0, 0.12);
}
.motion-reduced .pk-slider.pk-held .pk-slider-thumb {
  scale: none;
}

/* (23) segmented control: the knob slides on a 350 ms spring, swells to glass when pressed and can be dragged
   (segmented.style 'gallery', D04). The alternative, 'squish', slides on a curve and squishes. */
.pk-seg {
  position: relative;
  display: flex;
  height: 36px;
  border-radius: 999px;
  background: var(--fill);
  padding: 2px;
  touch-action: none;
}
.pk-seg > button {
  position: relative;
  z-index: 1;
  flex: 1;
  min-width: 44px;
  font-size: 15px;
  font-weight: 500;
  border-radius: 999px;
  color: var(--fg);
}
.pk-seg-ind {
  left: 2px;
  top: 2px;
  bottom: 2px;
  width: calc((100% - 4px) / var(--pk-n, 2));
  background: var(--pk-seg-knob);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}
.pk-seg-squish .pk-seg-ind {
  transition:
    translate calc(var(--dur-squish) * var(--pk-speed)) var(--ease-knob),
    background-color calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-seg-ind.pk-squish {
  animation: pk-squish calc(var(--dur-squish) * var(--pk-speed)) var(--ease-knob);
}
@keyframes pk-squish {
  35% {
    scale: 1.22 0.86;
  }
  70% {
    scale: 0.96 1.04;
  }
}
.motion-reduced .pk-seg-ind.pk-squish {
  animation: none;
}

/* (24) stepper: a glass capsule with − and +; the halves only light up */
.pk-stepper {
  display: inline-flex;
  height: 34px;
  border-radius: 999px;
  flex: none;
}
.pk-stepper > button {
  width: 48px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  color: var(--fg);
}
.pk-stepper > button:disabled {
  opacity: 0.35;
}
.pk-stepper-div {
  width: 0.5px;
  background: var(--sep);
  margin: 8px 0;
}

/* (25) progress: a bar, a spinner and a ring (--pk-v from 0 to 100) */
.pk-progress {
  height: 6px;
  border-radius: 3px;
  background: var(--pk-switch-off);
  overflow: hidden;
  flex: 1;
}
.pk-progress > i {
  display: block;
  height: 100%;
  width: calc(var(--pk-v, 0) * 1%);
  background: var(--accent);
  border-radius: 3px;
  transition: width calc(var(--dur-progress) * var(--pk-speed)) var(--ease-decel);
}
.pk-spinner {
  width: 24px;
  height: 24px;
  color: var(--fg2);
  animation: pk-spin calc(var(--dur-spin) * var(--pk-speed)) var(--ease-steps) infinite;
}
@keyframes pk-spin {
  to {
    rotate: 360deg;
  }
}
.pk-ring {
  width: 34px;
  height: 34px;
  rotate: -90deg;
}
.pk-ring circle {
  fill: none;
  stroke-width: 4;
}
.pk-ring .pk-ring-bg {
  stroke: var(--pk-switch-off);
}
.pk-ring .pk-ring-fg {
  stroke: var(--accent);
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: calc(100 - var(--pk-v, 0));
  transition: stroke-dashoffset calc(var(--dur-progress) * var(--pk-speed)) var(--ease-decel);
}

/* (26, 27, 29) inputs: solid wells (12% grey in light, 24% in dark), no blur. Text stays at 17 pt so iOS doesn't zoom.
   (26) the search field stretches when dragged (about 7 pt lengthwise, 2 pt across; measured from Photos) */
.pk-field,
.pk-search {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  border-radius: var(--r-medium);
  background: var(--fill);
  padding: 0 12px;
  color: var(--fg2);
}
.pk-search {
  border-radius: 999px;
  touch-action: pan-y;
}
.pk-search,
.pk-search-field {
  transition: scale var(--dur-settle) var(--ease-settle), translate var(--dur-settle) var(--ease-settle);
}
.pk-dock .pk-search-field {
  transition:
    scale var(--dur-pill) var(--ease-pill),
    translate var(--dur-settle) var(--ease-settle),
    opacity calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out);
}
.pk-stretching {
  transition: none !important;
}
.pk-field input,
.pk-field textarea,
.pk-search input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font: inherit;
  font-size: 17px;
  color: var(--fg);
}
:is(.pk-field, .pk-search) ::placeholder {
  color: var(--fg3);
}
.pk-field-clear {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--fg3);
  color: var(--surface);
  display: none;
  align-items: center;
  justify-content: center;
  flex: none;
}
.pk-has > .pk-field-clear {
  display: flex;
}
.pk-field.pk-area {
  height: auto;
  align-items: flex-start;
  padding: 10px 12px;
}
.pk-field.pk-area textarea {
  resize: none;
  min-height: 66px;
  line-height: 1.35;
  padding: 0;
  overflow: hidden;
}

/* ===================================================================================================================
   LISTS · lists stay solid, not glass
   =================================================================================================================== */

/* (36) grouped section: a header, rows in an inset group (corners 20) and a footer */
.pk-list {
  position: relative;
  background: var(--surface);
  border-radius: var(--r-card);
  overflow: hidden;
}
.pk-section-head {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--fg2);
  margin: 0 16px 6px;
}
.pk-section-foot {
  font-size: 13px;
  color: var(--fg2);
  margin: 6px 16px 0;
}
/* (35) list row: 50 pt, a 34 pt icon tile, a chevron when it opens something. Rows that do something (a button, a
   link or .pk-tap) highlight while pressed (row.press 'highlight', D06) or shrink to --press-row ('shrink') */
.pk-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 50px;
  width: 100%;
  padding: 8px 16px;
  background: var(--surface);
  color: var(--fg);
  text-align: left;
  font: inherit;
  font-size: 17px;
}
.pk-row + .pk-row::before,
.pk-row.pk-sep::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 16px;
  height: 0.5px;
  background: var(--sep);
}
.pk-tiles .pk-row + .pk-row::before {
  left: 62px;
}
.pk-row-text {
  flex: 1;
  min-width: 0;
}
.pk-row-text small {
  display: block;
  font-size: 13px;
  color: var(--fg2);
  margin-top: 1px;
}
.pk-row-value {
  color: var(--fg2);
}
.pk-chev {
  color: var(--fg3);
}
.pk-tile {
  width: 34px;
  height: 34px;
  border-radius: var(--r-small);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex: none;
}
:is(button.pk-row, a.pk-row, .pk-row.pk-tap) {
  cursor: pointer;
  transition:
    background-color calc(var(--dur-fade) * var(--pk-speed)) var(--ease-out),
    scale var(--dur-release) var(--ease-release);
}
.pk-row.pk-pressed {
  background-color: var(--pk-row-press);
  transition: none;
}
.pk-row-shrink .pk-row.pk-pressed {
  background-color: var(--surface);
  scale: var(--press-row);
  transition: scale calc(var(--dur-quick) * var(--pk-speed)) var(--ease-pop);
}
.motion-reduced.pk-row-shrink .pk-row.pk-pressed,
.motion-reduced .pk-row-shrink .pk-row.pk-pressed {
  scale: none;
}

/* (33) glass container: a plain glass panel that can hold anything. (34) card: a glass card */
.pk-container {
  border-radius: var(--r-card);
  padding: 16px;
}
.pk-card {
  border-radius: var(--r-large);
  padding: 16px;
}

/* (38) divider: a hairline, full width or inset past an icon */
.pk-divider {
  height: 0.5px;
  background: var(--sep);
  margin: 12px 0;
}
.pk-divider.pk-inset {
  margin-left: 46px;
}

/* (39) swipe actions: swipe a row left to show its actions (Delete is 88 pt). Tap elsewhere to close */
.pk-swipe {
  position: relative;
  overflow: hidden;
  background: var(--surface);
}
.pk-swipe + .pk-swipe::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 16px;
  height: 0.5px;
  background: var(--sep);
  z-index: 2;
}
.pk-swipe-actions {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  display: flex;
  visibility: hidden;
}
.pk-swipe.pk-show .pk-swipe-actions {
  visibility: visible;
}
.pk-swipe-actions > button {
  width: 88px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--fg3);
}
.pk-swipe-actions > .pk-red {
  background: var(--danger);
}
.pk-swipe-actions > .pk-orange {
  background: var(--pk-orange);
}
.pk-swipe-front {
  position: relative;
  z-index: 1;
  touch-action: pan-y;
  translate: var(--pk-sx, 0px) 0;
  transition: translate var(--dur-gentle) var(--ease-gentle);
}
.pk-swipe-front.pk-dragging {
  transition: none;
}

/* (40) reorderable list: hold the handle and drag */
.pk-reorder > * {
  transition: translate var(--dur-gentle) var(--ease-gentle);
}
.pk-reorder > .pk-lifted {
  z-index: 5;
  transition: none;
  box-shadow: var(--shadow-lifted);
  border-radius: var(--r-medium);
}
.pk-grip {
  color: var(--fg3);
  touch-action: none;
  cursor: grab;
  padding: 8px;
  margin: -8px;
}

/* ===================================================================================================================
   OVERLAYS · made by Parts.sheet(), .cover(), .popover(), .menu(), .choices(), .confirm() and .toast()
   =================================================================================================================== */

/* (41, 42) sheet: rises from the bottom, 8 pt from the edges, corners following the screen's (--r-sheet, D17).
   Drag it down from its header or, when its content is at the top, from the content; a flick faster than 700 pt/s
   jumps a stop or closes it. With stops (sheet.withStops, D09): 45% and full (90 pt from the top), turning solid at

  const itemsOf = (bar) => $$(bar.classList.contains('pk-tabbar') ? ':scope > .pk-tab' : ':scope > button', bar);

  const squishy = (bar) => bar.classList.contains('pk-seg') && S.segmented.style === 'squish';
  function refreshBar(bar) {
    const its = itemsOf(bar);
    if (!its.length) return;
    let i = its.findIndex((t) => t.classList.contains('on'));
    if (i < 0) {
      i = 0;
      its[0].classList.add('on');
    }
    bar.style.setProperty('--pk-n', its.length);
    bar.style.setProperty('--pk-i', i);
    its.forEach((t, j) => t.setAttribute(bar.classList.contains('pk-tabbar') ? 'aria-selected' : 'aria-pressed', String(j === i)));
  }
  function selectBar(bar, i, quiet) {
    const its = itemsOf(bar);
    if (!its[i]) return;
    const was = its.findIndex((t) => t.classList.contains('on'));
    its.forEach((t, j) => t.classList.toggle('on', j === i));
    refreshBar(bar);
    if (squishy(bar) && was !== i && motion.on()) {
      const k = indOf(bar);
      if (k) {
        k.classList.remove('pk-squish');
        void k.offsetWidth;
        k.classList.add('pk-squish');

  const nearestItem = (bar, cx) => {

      k.style.setProperty('--pk-by', ((k.offsetHeight + N.bloom[1]) / k.offsetHeight).toFixed(3));

  doc.addEventListener('pointerdown', (ev) => {

  });
  function endBar(ev) {
    const d = barDrag;

  doc.addEventListener('pointercancel', endBar);
  // place every bar's highlight when it appears (screens drawn as HTML text need no call)
  let refreshQueued = false;
  function refreshAll() {

    });

    initSteppers();
  }

    if (!refreshQueued) {

  };
  if (window.MutationObserver) new MutationObserver(queueRefresh).observe(doc.documentElement, { childList: true, subtree: true });

  /* (5, 6) the dock: the folded pill opens the bar; the search circle opens the search field; ✕ closes it */
  doc.addEventListener('click', (ev) => {
    const t = ev.target.closest && ev.target.closest('.pk-tab-pill, .pk-search-circle, .pk-search-close');
    if (!t) return;
    const dock = t.closest('.pk-dock');
    if (!dock) return;
    if (t.classList.contains('pk-tab-pill')) return dock.classList.remove('pk-folded');
    const on = t.classList.contains('pk-search-circle');
    dock.classList.toggle('pk-searching', on);

    const inp = dock.querySelector('.pk-search-field input');
    if (inp) {

      else {
        inp.value = '';

  /* (6) the keyboard: while a dock is searching, it rides --pk-kb-gap (8 pt) above the iPhone keyboard, so the field
     and what's typed stay in view. It follows the visible area (visualViewport) as the keyboard moves: no spring of
     its own, so Reduce Motion and speed 0 change nothing. The lift is published as --pk-kb on <html>, so an app can
     give its list that much more room at the bottom. After ✕ the dock stays lifted until the keyboard has gone, so it
     comes down with it. Pinch zoom (scale ≠ 1) is not a keyboard and lifts nothing. */
  let kbDock = null,
    kbLift = 0,
    kbUntil = 0;
  function kbSet(lift) {
    if (lift === kbLift) return;

      kbDock.classList.toggle('pk-kb', lift > 0);
      kbDock.style.setProperty('--pk-kb-lift', lift + 'px');
    }

  function kbFollow(dock) {

      kbDock.style.removeProperty('--pk-kb-lift');

    kbDock = dock;
  }
  function keyboard() {

  doc.addEventListener('focusin', (ev) => {

  /* (10) pushed page: Parts.push(page, {under}) slides it in; swipe right from anywhere on it, or Parts.pop(page) */
  const navDims = new WeakMap();
  function underOf(page, o) {

      u.classList.add('pk-pushed-under');

    navDim(page).classList.add('pk-on');
    emit(page, 'push');
  }
  function pop(page) {
    const u = page._pkUnder;
    page.classList.remove('pk-on');
    page.style.setProperty('--pk-px', '0px');
    if (u) {
      u.classList.remove('pk-pushed-under');
      u.classList.add('pk-pushed-back');
      u.style.removeProperty('translate');
    }

      if (page.classList.contains('pk-on')) return;

  let backDrag = null;
  doc.addEventListener('pointerdown', (ev) => {
    if (ev.button > 0) return;

  });
  doc.addEventListener('pointermove', (ev) => {
    const d = backDrag;
    if (!d || ev.pointerId !== d.id) return;

      page._pkUnder.style.removeProperty('translate');
    }

  doc.addEventListener('pointercancel', endBack);

  /* (11) top bar buttons changing between pages (measured): Parts.bar.swap(button, iconHTML) blurs the old icon out
     (σ 6) and the new one in (σ 3.5) while the circle swells up to 22%; Parts.bar.appear(slot, html) and
     Parts.bar.leave(slot) add or take away a button (250 ms in, 350 ms out). Reduce Motion: a short cross-fade. */
  const bar = {
    swap(btn, iconHTML) {
      const old = btn.querySelector(':scope > .pk-ico');
      const nu = doc.createElement('span');
      nu.className = 'pk-ico';
      nu.innerHTML = iconHTML;
      btn.append(nu);
      const T = dur('--dur-morph', btn);
      if (!old) return;
      if (!motion.on() || !T) {
        if (motion.reduced() && T) {
          old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur('--dur-reduced', btn), fill: 'forwards' }).onfinish = () => old.remove();

      old.animate([{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(6px)' }], { duration: T * 0.42, easing: 'linear', fill: 'forwards' }).onfinish = () => old.remove();

    },
    appear(slot, buttonHTML) {
      slot.insertAdjacentHTML('beforeend', buttonHTML);
      const b = slot.lastElementChild;
      return appearAs(b, 1.1, true);
    },
    leave(slot, btn) {
      const b = btn || slot.lastElementChild;
      if (!b) return Promise.resolve();
      return leaveAs(b, true);
    },
  };
  // the materialize choreography (M): in over 250 ms (glass full at 92%, content sharpening from an 8 px blur over
  // the last 65%, scale from 1.15, or 1.1 inside a bar); out over 350 ms (content gone by 55%, then the empty glass)
  function appearAs(el, from, force) {
    const T = dur('--dur-appear', el);
    if (!force && !motion.on()) return Promise.resolve();
    if (!T) return Promise.resolve();
    if (motion.reduced()) return el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur('--dur-reduced', el) }).finished.catch(() => {});
    const inner = el.querySelector('svg, .pk-ico, span');
    if (inner) inner.animate([{ opacity: 0, filter: 'blur(8px)' }, { opacity: 0, filter: 'blur(8px)', offset: 0.35 }, { opacity: 1, filter: 'blur(0px)' }], { duration: T, easing: 'linear' });

    const a = el.animate([{ scale: '1', opacity: 1 }, { scale: '1.15', opacity: 0 }], { duration: T, easing: 'linear', fill: 'forwards' });
    return a.finished.then(done, done);
  }

  /* (15) buttons on a bar that toggle (.pk-group.pk-toggles): aria-pressed, and a pk:change */
  doc.addEventListener('click', (ev) => {
    const b = ev.target.closest && ev.target.closest('.pk-group.pk-toggles > .pk-btn');
    if (!b) return;

  /* (17) edit button: data-pk-edit="#list" (or the list it's in) toggles .pk-editing; its label becomes Done */
  doc.addEventListener('click', (ev) => {
    const b = ev.target.closest && ev.target.closest('[data-pk-edit]');

  /* (18) chips: a tap picks or unpicks (not the "+ Your own" chip, and not in a .pk-chips.pk-static) */
  doc.addEventListener('click', (ev) => {

  /* ============================================================================================================
     CONTROLS AND INPUTS
     ============================================================================================================ */

  /* (21) switch: .pk-switch (with a .pk-switch-knob inside); .on when on. Tap, or drag the knob: a flick faster than

    } catch (e) {}

  });
  doc.addEventListener('pointermove', (ev) => {
    const d = swDrag;
    if (!d || ev.pointerId !== d.id) return;
    const s = scaleOf(d.sw), dx = (ev.clientX - d.x) / s;
    d.tr.add(ev.clientX / s);

    d.moved = true;
    d.sw.classList.add('pk-dragging');
    const x = Math.max(0, Math.min(N.switchTravel, (d.on ? N.switchTravel : 0) + dx));
    d.sw.querySelector('.pk-switch-knob').style.setProperty('--pk-sx', x + 'px');
  });
  function endSwitch(ev) {
    const d = swDrag;
    if (!d || ev.pointerId !== d.id) return;
    swDrag = null;
    const sw = d.sw;
    sw.classList.remove('pk-held', 'pk-dragging');
    if (ev.type === 'pointercancel' && !d.moved) return;
    let on;
    if (!d.moved) on = !d.on;
    else {
      const v = d.tr.v(), k = sw.querySelector('.pk-switch-knob');
      const x = parseFloat(k.style.getPropertyValue('--pk-sx')) || 0;

  }
  doc.addEventListener('pointerup', endSwitch);
  doc.addEventListener('pointercancel', endSwitch);
  doc.addEventListener('click', (ev) => {
    // keyboard (Space or Enter on a focused switch) and taps on a .pk-switch-row
    const sw = ev.target.closest && ev.target.closest('.pk-switch');
    if (sw) {
      if (ev.detail === 0) setSwitch(sw, !sw.classList.contains('on'));
      return;
    }
    const row = ev.target.closest && ev.target.closest('.pk-switch-row');
    const s2 = row && row.querySelector('.pk-switch');
    if (s2 && !ownedBy(ev.target, row)) setSwitch(s2, !s2.classList.contains('on'));
  });
  doc.addEventListener('keydown', (ev) => {
    const sw = ev.target.closest && ev.target.closest('.pk-switch');
    if (sw && (ev.key === ' ' || ev.key === 'Enter')) {
      ev.preventDefault();
      setSwitch(sw, !sw.classList.contains('on'));
    }
    const sl = ev.target.closest && ev.target.closest('.pk-slider');
    if (sl && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
      ev.preventDefault();
      const o = sliderOpts(sl);
      setSlider(sl, o.value + (ev.key === 'ArrowRight' ? 1 : -1) * (o.step || (o.max - o.min) / 20), true);
    }
  });

  /* (22) slider: .pk-slider with data-min, data-max, data-step, data-value (0–100 by default). The knob grows ×1.35
     while held; the fill follows the finger. pk:input while moving, pk:change on letting go. */
  function sliderOpts(sl) {
    const n = (k, d) => (sl.dataset[k] != null && sl.dataset[k] !== '' && !isNaN(+sl.dataset[k]) ? +sl.dataset[k] : d);

      grow: () => false,
      to() {},
      close(why) {
        if (ctl.closed) return;
        ctl.closed = true;
        untrack(ctl);
        el.classList.add('pk-leaving');
        el.classList.remove('pk-on');
        after(() => el.remove(), motion.reduced() ? dur('--dur-reduced', el) : dur('--dur-leave', el));
        emit(el, 'close', { why: why || 'close' });
        if (o.onClose) o.onClose(why || 'close');
      },
    });
    el.querySelector('.pk-sheet-close').addEventListener('click', () => ctl.close('button'));
    emit(el, 'open', { key: o.key });
    return ctl;
  }

  /* (16, 44) growing out of a button: place a panel next to its anchor and morph it out of the anchor */
  function morphFrom(anchor, panel, where) {
    layer().append(panel);
    const b = rel(anchor), pw = panel.offsetWidth, ph = panel.offsetHeight, W = screenW(), Hh = screenH();
    where = where || (b.x + b.w / 2 > (W * 2) / 3 ? 'right' : b.x + b.w / 2 < W / 3 ? 'left' : 'center');
    let x = where === 'right' ? b.x + b.w - pw : where === 'center' ? b.x + b.w / 2 - pw / 2 : b.x;
    x = Math.max(12, Math.min(W - pw - 12, x));
    let y = b.y + b.h + 8;
    if (y + ph > Hh - 24) y = Math.max(12, b.y - ph - 8);
    panel.style.left = x + 'px';
    panel.style.top = y + 'px';
    panel.style.setProperty('--pk-ox', (b.x + b.w / 2 - x).toFixed(1) + 'px');
    panel.style.setProperty('--pk-oy', (y > b.y ? 0 : ph) + 'px');
    panel.style.setProperty('--pk-s0x', Math.min(1, b.w / pw).toFixed(3));
    panel.style.setProperty('--pk-s0y', Math.min(1, b.h / ph).toFixed(3));
    void panel.offsetWidth;
    panel.classList.add('pk-on');
  }
  function unmorph(panel) {
    panel.classList.remove('pk-on');
    panel.classList.add('pk-leaving');
    after(() => panel.remove(), Math.max(motion.spring('menu-close', panel) * 0.6, dur('--dur-close', panel), motion.reduced() ? dur('--dur-reduced', panel) : 0));
  }

  /* menus: items are { label, icon (svg text), red, disabled, value, sub: [items] } or '-' for a gap */
  function menuRows(items, subsOn) {
    return items
      .map((it, i) => {
        if (it === '-') return '<div class="pk-menu-sep"></div>';
        if (it.sub && !subsOn)
          return '<div class="pk-menu-label">' + esc(it.label) + '</div>' + menuRows(it.sub, false) + (i < items.length - 1 && items[i + 1] !== '-' ? '<div class="pk-menu-sep"></div>' : '');
        return (
          '<button class="pk-menu-item' + (it.red ? ' pk-red' : '') + '" data-i="' + i + '"' + (it.disabled ? ' disabled' : '') + ' data-name="Menu row: ' + esc(it.label) + '"><span>' +
          esc(it.label) + '</span>' + (it.sub ? icon('chevR', 18) : it.icon || '') + '</button>'
        );
      })
      .join('');
  }
  function flatItems(items, subsOn) {
    // the item objects in the same order as their rows, for picking
    const out = [];
    items.forEach((it) => {
      if (it === '-') return;
      if (it.sub && !subsOn) out.push(...flatItems(it.sub, false));
      else out.push(it);
    });
    return out;
  }
  function buildMenu(items, o, subsOn) {
    const m = doc.createElement('div');
    m.className = 'pk-menu pk-morph';
    named(m, o, 'Menu');
    m.setAttribute('role', 'menu');
    m.innerHTML = menuRows(items, subsOn);
    // number the rows in order so a flattened submenu still picks the right item
    const list = flatItems(items, subsOn);
    $$('.pk-menu-item', m).forEach((b, i) => (b.dataset.i = i));
    m._items = list;
    return m;
  }
  /* Parts.menu(anchor, items, { key, name, style, place: 'left' | 'center' | 'right', onPick(item) }) → { el, close() }
     (16) a pull-down menu growing out of its button. (45, pinned) items with sub open a submenu where
     menu.submenus names the menu's key; elsewhere they're shown inline under a small label. */
  function menu(anchor, items, o) {
    o = o || {};
    const subsOn = allowed(S.menu.submenus, o.key);
    const m = buildMenu(items, o, subsOn);
    let sub = null;
    const dim = dimLayer('pk-clear-dim', () => ctl.close());
    morphFrom(anchor, m, o.place);
    const ctl = track({
      el: m,
      close() {
        if (ctl.closed) return;
        ctl.closed = true;
        untrack(ctl);
        unmorph(m);
        if (sub) {
          const sb = sub;
          sb.classList.remove('pk-on');
          after(() => sb.remove(), dur('--dur-fade', sb));
        }
        dropDim(dim, 0);
        emit(anchor, 'close');
      },
    });
    function pick(it, row) {
      if (it.sub && subsOn) return openSub(it, row);
      ctl.close();
      emit(anchor, 'pick', { item: it, value: it.value != null ? it.value : it.label });
      if (o.onPick) o.onPick(it);
    }
    function openSub(it) {
      const sb = buildMenu([{ label: it.label, back: true }].concat(it.sub), { name: 'Submenu' }, false);
      sb.classList.remove('pk-morph');
      sb.classList.add('pk-submenu');
      sb.firstChild.innerHTML = icon('chevL', 18) + '<span style="font-weight:600">' + esc(it.label) + '</span>';
      layer().append(sb);
      const r = rel(m);
      sb.style.left = r.x + 10 + 'px';
      sb.style.top = r.y + 26 + 'px';
      m.classList.add('pk-recede');
      void sb.offsetWidth;
      sb.classList.add('pk-on');
      sub = sb;
      sb.addEventListener('click', (ev) => {
        const b = ev.target.closest('.pk-menu-item');
        if (!b) return;
        const x = sb._items[+b.dataset.i];
        if (x.back) {
          m.classList.remove('pk-recede');
          sb.classList.remove('pk-on');
          after(() => sb.remove(), dur('--dur-recede', sb));
          sub = null;
          return;
        }
        pick(Object.assign({ parent: it.label }, x));
      });
      emit(anchor, 'submenu', { item: it });
    }
    m.addEventListener('click', (ev) => {
      const b = ev.target.closest('.pk-menu-item');
      if (b && !b.disabled) pick(m._items[+b.dataset.i], b);
    });
    emit(anchor, 'open');
    return ctl;
  }

  /* (44) Parts.popover(anchor, html | node, { name, style }) → { el, close() }: grows out of its button; tap outside closes */
  function popover(anchor, html, o) {
    o = o || {};
    const p = doc.createElement('div');
    p.className = 'pk-popover pk-morph';
    named(p, o, 'Popover');
    p.innerHTML = content(html);
    place(p, html);
    const dim = dimLayer('pk-clear-dim', () => ctl.close());
    morphFrom(anchor, p, o.place || 'center');
    const ctl = track({
      el: p,
      close() {
        if (ctl.closed) return;
        ctl.closed = true;
        untrack(ctl);
        unmorph(p);
        dropDim(dim, 0);
      },
    });
    return ctl;
  }

  /* (46) long-press: hold a .pk-hold. It lifts from timing.lift (200 ms) and at timing.hold (700 ms) sends pk:hold;
     call ev.detail.open(items, { onPick, name }) in your listener to show its menu. Moving more than 10 pt or letting
     go early cancels; right-click opens it at once. */
  let hold = null;
  function contextMenu(row, items, o) {
    o = o || {};
    row.classList.remove('pk-lifting');
    const b = rel(row);
    const clone = row.cloneNode(true);
    clone.removeAttribute('id');
    $$('[id]', clone).forEach((x) => x.removeAttribute('id'));
    clone.classList.remove('pk-hold', 'pk-lifting', 'pk-pressed');
    clone.classList.add('pk-lift-clone');
    clone.dataset.name = 'Lifted row';
    clone.style.cssText += ';left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.h + 'px;background:' + (getComputedStyle(row).backgroundColor === 'rgba(0, 0, 0, 0)' ? 'var(--surface)' : getComputedStyle(row).backgroundColor);
    const dim = dimLayer('pk-soft', () => ctl.close());
    layer().append(clone);
    const m = buildMenu(items, o, allowed(S.menu.submenus, o.key));
    layer().append(m);
    const W = screenW(), mh = m.offsetHeight, mw = m.offsetWidth;
    let y = b.y + b.h * N.liftScale + 8;
    if (y + mh > screenH() - 24) y = Math.max(12, b.y - mh - 8);
    const x = Math.max(12, Math.min(W - mw - 12, b.x + 8));
    m.style.left = x + 'px';
    m.style.top = y + 'px';
    m.style.setProperty('--pk-ox', '30px');
    m.style.setProperty('--pk-oy', (y > b.y ? 0 : mh) + 'px');
    m.style.setProperty('--pk-s0x', '0.3');
    m.style.setProperty('--pk-s0y', '0.3');
    void m.offsetWidth;
    m.classList.add('pk-on');
    const ctl = track({
      el: m,
      close() {
        if (ctl.closed) return;
        ctl.closed = true;
        untrack(ctl);
        unmorph(m);
        clone.style.opacity = '0';
        after(() => clone.remove(), dur('--dur-close', m));
        dropDim(dim, dur('--dur-close', m));
        emit(row, 'close');
      },
    });
    m.addEventListener('click', (ev) => {
      const bt = ev.target.closest('.pk-menu-item');
      if (!bt || bt.disabled) return;
      const it = m._items[+bt.dataset.i];
      ctl.close();
      emit(row, 'pick', { item: it, value: it.value != null ? it.value : it.label });
      if (o.onPick) o.onPick(it);
    });
    return ctl;
  }
  function fireHold(row, instant) {
    let opened = null;
    const ev = emit(row, 'hold', {
      instant: !!instant,
      open: (items, o) => (opened = contextMenu(row, items, o)),
    });
    if (!opened) row.classList.remove('pk-lifting');
    return ev;
  }
  const cancelHold = () => {
    if (!hold) return;
    clearTimeout(hold.t1);
    clearTimeout(hold.t2);
    hold.row.classList.remove('pk-lifting');
    hold = null;
  };
  doc.addEventListener('pointerdown', (ev) => {
    if (ev.button > 0) return;
    const row = ev.target.closest && ev.target.closest('.pk-hold');
    if (!row || ownedBy(ev.target, row)) return;
    cancelHold();
    const h = { row, x: ev.clientX, y: ev.clientY, id: ev.pointerId };
    h.t1 = later(() => {
      if (hold === h && !motion.reduced()) row.classList.add('pk-lifting');
    }, S.timing.lift);
    h.t2 = later(() => {
      if (hold !== h) return;
      hold = null;
      fireHold(row, false);
      row._pkHeld = performance.now();
    }, S.timing.hold);
    hold = h;
  });
  doc.addEventListener('pointermove', (ev) => {
    if (!hold || ev.pointerId !== hold.id) return;
    const s = scaleOf(hold.row);
    if (Math.hypot((ev.clientX - hold.x) / s, (ev.clientY - hold.y) / s) > N.holdMove) cancelHold();
  });
  doc.addEventListener('pointerup', cancelHold);
  doc.addEventListener('pointercancel', cancelHold);
  doc.addEventListener('contextmenu', (ev) => {
    const row = ev.target.closest && ev.target.closest('.pk-hold');
    if (!row) return;
    ev.preventDefault();
    cancelHold();
    fireHold(row, true);
  });
  // a tap that ends a hold isn't a click
  doc.addEventListener('click', (ev) => {
    const row = ev.target.closest && ev.target.closest('.pk-hold');
    if (row && row._pkHeld && performance.now() - row._pkHeld < 600) {
      ev.stopPropagation();
      ev.preventDefault();
    }
  }, true);

  /* (47) Parts.choices({ title, actions: [{ label, red, value }], cancel, key, name, style }) → Promise of the picked action's
     value (its label if no value), or null for Cancel. An action sheet (choices 'actionSheet', D07) or a sheet. */
  function choices(o) {
    o = o || {};
    const acts = o.actions || [];
    return new Promise((resolve) => {
      const done = (v) => resolve(v);
      if (S.choices === 'sheet') {
        let picked = null;
        const sh = sheet({
          key: o.key,
          name: o.name || 'Choices',
          style: o.style,
          title: o.title || '',
          html: '<div class="pk-list">' + acts.map((a, i) => '<button class="pk-row pk-tap" data-i="' + i + '" style="' + (a.red ? 'color:var(--danger)' : 'color:var(--accent)') + '"><span class="pk-row-text">' + esc(a.label) + '</span></button>').join('') + '</div>',
          onClose: () => done(picked),
        });
        sh.body.addEventListener('click', (ev) => {
          const b = ev.target.closest('[data-i]');
          if (!b) return;
          const a = acts[+b.dataset.i];
          picked = a.value != null ? a.value : a.label;
          sh.close('pick');
        });
        return;
      }
      const el = doc.createElement('div');
      el.className = 'pk-actions';
      named(el, o, 'Action sheet');
      el.setAttribute('role', 'dialog');
      el.innerHTML =
        '<div class="pk-actions-group pk-glass pk-strong">' + (o.title ? '<div class="pk-actions-title">' + esc(o.title) + '</div>' : '') +
        acts.map((a, i) => '<button class="pk-action' + (a.red ? ' pk-red' : '') + '" data-i="' + i + '" data-name="Action: ' + esc(a.label) + '">' + esc(a.label) + '</button>').join('') +
        '</div><div class="pk-actions-group pk-glass pk-strong"><button class="pk-action pk-cancel" data-i="-1" data-name="Cancel">' + esc(o.cancel || 'Cancel') + '</button></div>';
      const dim = dimLayer('pk-soft', () => ctl.close(null));
      layer().append(el);
      void el.offsetWidth;
      el.classList.add('pk-on');
      const ctl = track({
        el,
        close(v) {
          if (ctl.closed) return;
          ctl.closed = true;
          untrack(ctl);
          el.classList.add('pk-leaving');
          el.classList.remove('pk-on');
          dropDim(dim, dur('--dur-rise', el));
          after(() => el.remove(), motion.reduced() ? dur('--dur-reduced', el) : dur('--dur-rise', el));
          done(v === undefined ? null : v);
        },
      });
      el.addEventListener('click', (ev) => {
        const b = ev.target.closest('.pk-action');
        if (!b) return;
        const i = +b.dataset.i;
        ctl.close(i < 0 ? null : acts[i].value != null ? acts[i].value : acts[i].label);
      });
    });
  }

  /* (48) Parts.confirm({ title, message, action: 'Delete', red: true, cancel: 'Cancel', name, style }) → Promise<boolean>.
     With actions (1.3): Parts.confirm({ title, message, actions: [{ label, red, value }], cancel }) → Promise of the chosen
     action's value (its label if it has none), or null for Cancel. Three or more buttons stack, Cancel last.
     An alert (confirm 'alert', D08: the app's own, never window.confirm) or a sheet. */
  function confirmBox(o) {
    o = o || {};
    const many = Array.isArray(o.actions) && o.actions.length > 0;
    const acts = many
      ? o.actions.map((a) => ({
          label: String((a && a.label) || 'OK'),
          red: !!(a && a.red),
          value: a && a.value !== undefined ? a.value : String((a && a.label) || 'OK'),
        }))
      : [{ label: o.action || 'OK', red: o.red !== false, value: true }];
    const none = many ? null : false;
    const result = (i) => (typeof i === 'number' && i >= 0 && i < acts.length ? acts[i].value : none);
    const key = (i) => (many ? String(i) : 'yes');
    const btn = (a, i) =>
      '<button class="pk-alert-btn ' + (a.red ? 'pk-red' : 'pk-blue') + '" data-a="' + key(i) + '" data-name="Action: ' + esc(a.label) + '">' + esc(a.label) + '</button>';
    const cancelBtn = '<button class="pk-alert-btn" data-a="no" data-name="Cancel">' + esc(o.cancel || 'Cancel') + '</button>';
    const index = (b) => (b.dataset.a === 'no' ? -1 : b.dataset.a === 'yes' ? 0 : +b.dataset.a);
    return new Promise((resolve) => {
      if (S.confirm === 'sheet') {
        let picked = -1;
        const sh = sheet({
          key: o.key,
          name: o.name || 'Confirmation',
          style: o.style,
          title: o.title || '',
          html:
            (o.message ? '<p class="pk-alert-text" style="text-align:center">' + esc(o.message) + '</p>' : '') +
            '<div style="display:flex;flex-direction:column;gap:10px">' + acts.map(btn).join('') + cancelBtn + '</div>',
          onClose: () => resolve(result(picked)),
        });
        sh.body.addEventListener('click', (ev) => {
          const b = ev.target.closest('[data-a]');
          if (!b) return;
          picked = index(b);
          sh.close(picked < 0 ? 'no' : 'yes');
        });
        return;
      }
      const g = doc.createElement('div');
      g.className = 'pk-alert pk-glass pk-strong';
      named(g, o, 'Alert');
      g.setAttribute('role', 'alertdialog');
      const stack = acts.length + 1 >= 3;
      g.innerHTML =
        '<p class="pk-alert-title">' + esc(o.title || '') + '</p>' + (o.message ? '<p class="pk-alert-text">' + esc(o.message) + '</p>' : '') +
        (stack
          ? '<div class="pk-alert-btns pk-stack">' + acts.map(btn).join('') + cancelBtn + '</div>'
          : '<div class="pk-alert-btns">' + cancelBtn + btn(acts[0], 0) + '</div>');
      const dim = dimLayer('pk-soft');
      layer().append(g);
      void g.offsetWidth;
      g.classList.add('pk-on');
      const ctl = track({
        el: g,
        close(i) {
          if (ctl.closed) return;
          ctl.closed = true;
          untrack(ctl);
          g.classList.add('pk-leaving');
          g.classList.remove('pk-on');
          dropDim(dim, dur('--dur-leave', g));
          after(() => g.remove(), motion.reduced() ? dur('--dur-reduced', g) : dur('--dur-leave', g));
          resolve(result(i));
        },
      });
      g.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-a]');
        if (b) ctl.close(index(b));
      });
    });
  }

  /* (49) Parts.toast(text, { undo: fn, undoLabel, ms, name, style }) → { el, close() }: one at a time; a new one replaces it */
  let toastNow = null;
  function toast(text, o) {
    o = o || {};
    if (toastNow) toastNow.close();
    const t = doc.createElement('div');
    t.className = 'pk-toast pk-glass';
    named(t, o, 'Toast');
    t.setAttribute('role', 'status');
    t.innerHTML = '<span>' + esc(text) + '</span>' + (o.undo ? '<button class="pk-toast-undo" data-name="Undo">' + esc(o.undoLabel || 'Undo') + '</button>' : '');
    layer().append(t);
    void t.offsetWidth;
    t.classList.add('pk-on');
    const ctl = {
      el: t,
      close() {
        if (ctl.closed) return;
        ctl.closed = true;
        clearTimeout(ctl.timer);
        if (toastNow === ctl) toastNow = null;
        t.classList.add('pk-leaving');
        t.classList.remove('pk-on');
        after(() => t.remove(), motion.reduced() ? dur('--dur-reduced', t) : dur('--dur-toast-out', t));
      },
    };
    ctl.timer = later(ctl.close, o.ms || S.timing.toast);
    const u = t.querySelector('.pk-toast-undo');
    if (u)
      u.addEventListener('click', () => {
        ctl.close();
        o.undo();
      });
    toastNow = ctl;
    return ctl;
  }

  /* ==PARTS== (each group below adds its part) */

  /* ============================================================================================================
     THE PUBLIC CALLS
     ============================================================================================================ */
  const Parts = {
    version: VERSION,
    settings,
    get current() {
      return clone(Object.assign({}, S, { root: null }));
    },
    problems,
    check: () => problems.slice(),
    allowed: (group, key) => {
      const g = { submenus: S.menu.submenus, appear: S.glass.appear, glint: S.press.glint, withStops: S.sheet.withStops, growsToFull: S.sheet.growsToFull, fullScreen: S.sheet.fullScreen }[group];
      return allowed(g, key);
    },
    motion,
    N,
    SCHEMA,
    DEFAULTS: clone(DEFAULTS),
    own: () => S.own,
    layer,
    rel,
    refresh: refreshAll,
    differences,
    keyboard,
    sheet,
    cover,
    menu,
    popover,
    contextMenu,
    choices,
    confirm: confirmBox,
    toast,
    closeAll: () => open.slice().reverse().forEach((o) => o.close()),
    get open() {
      return open.length;
    },
    html: {
      // the 8-spoke iOS spinner
      spinner: () => {
        let l = '';
        for (let i = 0; i < 8; i++)
          l += '<line x1="12" y1="3" x2="12" y2="7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="' + (0.25 + i * 0.1).toFixed(2) + '" transform="rotate(' + i * 45 + ' 12 12)"/>';
        return '<svg class="pk-spinner" viewBox="0 0 24 24" data-name="Spinner" aria-label="Loading">' + l + '</svg>';
      },
    },
    setSwitch: (sw, on) => setSwitch(sw, !!on, true),
    setSlider: (sl, v) => setSlider(sl, v, false),
    setStepper: (st, v) => setStepper(st, v, true),
    select: (barEl, i) => selectBar(barEl, i, true),
    push,
    pop,
    bar,
    appear: (el, o) => (allowed(S.glass.appear, o && o.key) ? appearAs(el, (o && o.from) || 1.15) : Promise.resolve()),
    leave: (el, o) => (allowed(S.glass.appear, o && o.key) ? leaveAs(el) : (el.remove(), Promise.resolve())),
  };
  Object.assign(Parts, window.__pkParts || {});
  window.Parts = Parts;
  apply();
})();

</script>
<script id="gallery-js">
(function(){
'use strict';
const app = document.getElementById('app');
const $ = (s, r) => (r || app).querySelector(s);
const $$ = (s, r) => Array.from((r || app).querySelectorAll(s));

/* ---------- the gallery's settings: the kit's defaults, with the pinned parts switched on for their demos ---------- */
const PINNED = { menu: { submenus: ['options'] }, glass: { appear: ['star'] }, press: { glint: ['pad'] } };
Parts.settings(Object.assign({ app: 'Parts gallery', root: '#app', sheet: { withStops: ['stops', 'grows'], growsToFull: ['grows'], fullScreen: ['cover'] } }, PINNED));

/* ---------- icons ---------- */
const PATHS = {
  chevL:'M15 5l-7 7 7 7', chevR:'M9 5l7 7-7 7', chevD:'M6 9l6 6 6-6', plus:'M12 5v14M5 12h14', minus:'M5 12h14', x:'M6 6l12 12M18 6L6 18',

  `<div data-name="Grouped section"><div class="pk-section-head">Notifications</div><div class="pk-list pk-tiles">${row('Reminders', '', ['bell', 'var(--sys-red)'], `<span class="pk-row-value">On</span>${chev}`, 'button')}${row('Sounds', '', ['note', 'var(--sys-pink)'], `<span class="pk-row-value">Chime</span>${chev}`, 'button')}${row('Badges', '', ['grid', 'var(--sys-blue)'], chev, 'button')}</div><div class="pk-section-foot">Choose how you're told about new things.</div></div>`);
